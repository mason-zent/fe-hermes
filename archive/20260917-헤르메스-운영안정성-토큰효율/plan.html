        브라우저에서 "PLAN is not defined" 로 빈 화면이 된다. (그래서 위 [A][B] 는 태그가 아닌 script#id 표기다)

     [A] script#plan-data 의 PLAN 객체
         - title/type/scope/mdFile/summary
         - decisions[] : .md "사용자 결정 사항"과 1:1
           · 승인 전: options[] 만 채운다 (decided 생략)
           · 확정 후: 각 결정에 decided 를 채운다
                      (택1이면 문자열, 복수면 배열) → 해당 결정이 "✅ 확정"으로 잠김

         - 이 텍스트가 결정 콘솔 위에 렌더링되어 "보기 좋은 계획서"가 된다.
         - .md 가 단일 소스 — 수정 시 .md 와 이 블록을 같은 턴에 함께 갱신한다.
         - Checkpoint(Status/Progress/Next)만 바뀐 경우에도 이 블록은 동기화한다.
           단 decisions[] 는 승인된 결정이 바뀔 때만 건드린다.

  지원 마크다운: 제목(#~######), 굵게(**), 인라인코드(`), 코드펜스(```),
                 표(GFM), 목록(- * 1.), 인용(>), 구분선(---), 링크. (중첩목록 제외)
  ============================================================================
-->

- ⚠️ **미실행 1건** — `/new` 재개 시나리오 실측. Checkpoint만 읽고 작업을 이어갈 수 있는지는 실제로 끊어봐야 안다
- ⚠️ **측정 정정(부록 H)** — 부록 D 는 과대평가였다. 양쪽을 고정 ref 에서 다시 재니 국소 수정 **−24%**(목표 30% 미달), 새 화면 **+2% 증가**다. 자동 주입이 18,114 → 28,637 B 로 늘고 `rules.md`·`gotchas.md` 상시 로딩이 더해진 결과다. 정확도를 택한 대가이며 되돌리지 않는다
- ⚠️ 측정은 **문서 원문 바이트**이고 실제 입력 토큰이 아니다. 토큰 계측 수단이 없어 절감률을 토큰 기준으로 주장하지 않는다

### Decisions
- Codex 참여 = **수동 전달**. 헤르메스는 단계마다 커밋하고 diff 범위를 사용자에게 알린다. `codex exec` 자동 실행은 하지 않는다
- 적용 = **파일럿 우선**. 2단계(refund-fe) 후 사용자 승인을 받고 3단계로 넘어간다
- 범위 = 3.1~3.6 **전부** (공통 정책 · 에이전트 11개 · Checkpoint · `/sync` · `archive-plans.sh` · 불일치 G~O)
- 커밋 = **단계별**

### 2.3 가설이 틀렸던 부분 — Memory는 정리 대상이 아니다

현재 Hermes Memory는 **2건뿐**이고 둘 다 원 계획서 5.5의 **허용 범주**(장기 워크스페이스 운영 규칙)다.

| 항목 | 유형 | 판정 |
|---|---|---|
| `herdr-terminal-host` | user | 유지 — 실행 호스트 사실, 프로젝트 가변정보 아님 |
| `delegate-visibly` | feedback | 유지 — 작업 방식 지시, 프로젝트 상태 아님 |

→ **5.5의 "기존 항목 정리"는 이관·삭제 대상 0건.** 남는 일은 *앞으로 금지 항목이 기록되지 않게 하는 정책 문장 추가*뿐이다. 자동 기록 경로 차단은 도구 수준 통제가 없으므로 **정책상 한계로 명시**한다.

## 3. 변경 대상과 내용

원 계획서 5절을 실제 파일에 매핑한 것이다.

### 3.1 `AGENTS.md` — 선행 로딩 지시를 작업유형 기반으로 교체 (원 5.1)
- 2절 "작업 전 이 순서로 읽는다" → **필수 규칙 + 작업유형별 선택 로딩**으로 교체
- 3절 "새 코드를 쓰기 전에 workflows→patterns" 는 **새 구현에 한정**해 유지 (국소 수정에는 면제)
- 신설: 정보 신뢰도 절 — 지시 / 현재 구현 사실(코드) / 진행 상태(plan) / Memory·History(단서일 뿐)
- 신설: Memory 금지 목록, History 사용 규칙(원 5.6)
- 3절의 "에이전트 md = 상세 프로필" → "역할·범위·지식 진입점"으로 수정

**필수 규칙(항상 읽음)**: 담당 범위 제한 · 시크릿 금지 · 생성물 직접 편집 금지 · 커밋 금지 · 표준 검증 · 레포 고유 제약. 이건 선택 로딩으로 내리지 않는다.

### 3.2 `.claude/agents/*.md` 11개 + `reviewer.md` — 역할·라우터 중심 축소 (원 5.2/5.3)
**유지**: frontmatter(name/description/tools), 담당 repo·금지 범위, 모호한 서비스명 처리, 작업유형→knowledge 진입 표, 검증 스크립트 경로, 보고 형식 링크, 외부 의존 보고 조건
**이관**: 버전·포트·디렉토리 트리·스택 설명·prettier 설정 복제 → `knowledge/<레포>/{structure,rules}.md`

**이관 대응표는 5열로 쓴다** (Codex 지적 — 파일에 남아 있다는 사실만으로 소실 0건을 판정하면 안 된다):

| 원문 위치 | 항목 | 도착지 | **필수/조건부** | **읽는 작업 유형** |
|---|---|---|---|---|

- **필수**로 분류된 항목은 `rules.md` 상단 "필수" 절에 두고 **모든 작업 유형이 읽는다**. gotchas로 내리지 않는다
- 보안(키 파일 비출력), 범위 제한, 생성물 편집 금지, 용어 규칙은 **무조건 필수**
- 소실 위험 목록은 2.5절 표 참조 — 특히 refund `deal` 용어, web-op BaseApiGateway 상속 금지, zent-packages `.changeset` 예외, bznav-packages 루트 설정 예외는 knowledge에 **아직 없다**

각 프로필에 들어갈 작업유형 라우터:

| 작업 유형 | 추가로 읽을 것 |
|---|---|
| 문구·스타일 국소 수정 | 대상 파일 + 인접 사용처. patterns/workflows 불필요 |
| 새 화면·기능 | 해당 workflow 절 + patterns가 가리키는 파일 + 권한·라우팅 gotcha |

## 부록 C. 4단계 — `/sync` 정본화 (결정: A안)

### 문제

`/sync`는 탐지만 자동이고 **문서 수정은 사람이 손으로** 한다(스크립트 주석에 명시). 그래서 SKILL.md에 "4개 문서에 같은 사실이 있으면 모두 같은 턴에 고친다"가 절차로 박혀 있었다. 같은 값을 여러 번 옮겨 적는 구조라 불일치 A·B·C가 그렇게 생겼다.

예: "hub의 Next 버전"이 `services.md:12`, `playbook.html:357`, `playbook.html:577` 3곳에 손으로 적혀 있었다.

### 해결 — 사실마다 정본 1곳 + 파생은 생성

| 사실 | 정본 | 파생 |
|---|---|---|
| 레포·에이전트·기준 브랜치 매핑 | `hermes.config.json` | — |
| 버전·포트·Node/pnpm·Prettier·검증 스크립트·기준 커밋 | **지문** `.sync/snapshots/` | `services.md` 스택 표, `playbook.html` 기준 커밋 표·last sync → **생성** |
| 디렉토리·라우트 | `knowledge/<레포>/structure.md` | — |
| 규칙·필수 제약 | `knowledge/<레포>/rules.md` | — |
| 함정 | `knowledge/<레포>/gotchas.md` | — |
| 역할·범위·진입 경로 | `.claude/agents/<agent>.md` | — |

### 만든 것

**`scripts/build-derived.mjs`** — 지문 + config를 읽어 문서의 마커 구간을 다시 쓴다.
- `<!-- BEGIN:generated:<이름> --> ... <!-- END:generated:<이름> -->` 안만 교체
- **pending 우선** 읽기 — 순서가 "지문 생성 → 문서 갱신 → accept"이므로 곧 확정될 값으로 문서를 만들어야 한다 (설계 중 발견한 순서 문제)
- `--check` 로 쓰지 않고 차이만 확인 (CI·확정 전 점검용)
- 지문에 없는 사실(데이터·상태·UI·폼·인증)은 **생성하지 않고** 마커 밖에 둔다. 대신 Next major·포트가 지문과 어긋나면 **경고만** 낸다

**`sync-fingerprint.mjs` 수정** — `catalog` 값 저장 추가. bznav 앱들이 `next`/`react`를 `catalog:`로 받는데 지문에 `catalogHash`(해시)만 있어서 **실제 버전을 뽑을 수 없었고**, catalog가 바뀌어도 "해시 변경"만 보여 무엇이 바뀐지 알 수 없었다. 이제 sync 리포트에 버전 diff가 그대로 보인다.

**`sync/SKILL.md` 전면 개편** — 3단계를 "정본 갱신"으로 교체, 에이전트 md에 **스택 재삽입 금지** 명시, 불일치 B("대부분 dev" → config 참조)·C(없는 "스택 요약" 셀 지시 제거) 교정, **accept 금지 조건 4가지** 명문화.

**`archive-plans.sh` 수정** — `Status: done`만 이동(없음·`planned`·`in_progress`·`blocked`·`ready_for_review`는 전부 보류), `.md`와 `.html` **동반 이동**, 목적지 이름 충돌 확인.

### 검증

```
build-derived.mjs --check  → ✅ 마커·마커 밖 사실 모두 이상 없음
catalog 파서               → bznav next 16.2.5 / react 19.2.6 정확히 파싱 (22개 항목)
archive-plans.sh -n        → 문법 OK
archive 실동작 ①           → Status: done + 오래된 날짜 → md·html 쌍이 함께 archive/feature/ 로
archive 실동작 ②           → 이 계획서(in_progress) → "보류 (Status=in_progress)" ✅
```

### 남은 수동 작업

sync 뒤 손으로 할 일은 **정본 갱신 3종**뿐이다 — `structure.md`(구조 변화), `rules.md`(레포 규칙 문서 변화), 에이전트 md(역할·경로 변화). 버전·포트·기준 커밋은 명령 하나(`node scripts/build-derived.mjs`)로 끝난다.

필수 규칙 3종은 자동 주입만으로 이미 확보되어 있다(에이전트 보고):

### 결론 두 가지

**1. `.claude/rules/*.md` 4개를 지우면 안 된다.** 불일치 I 는 "중복이니 정리"가 아니라 **"이것이 Claude Code 의 필수 규칙 전달 경로"**로 결론난다. 4,856 B 를 줄이려다 필수 규칙 3종의 전달 경로 하나를 없앨 뻔했다. 확인 전에 손대지 않은 판단이 맞았다.

**2. 이번 설계가 필요했다는 증거가 나왔다.** `docs/knowledge/**` 는 **전부 자동 주입되지 않는다.** 즉 `rules.md` 의 "필수" 절과 `gotchas.md` 는 에이전트가 **직접 읽어야만** 한다. 프로필의 "시작 전 반드시 읽을 것" 목록이 없으면 이번에 새로 기재한 고유 제약(refund `deal` 용어, web-op `BaseApiGateway` 금지 등)은 **아무도 읽지 않는다.**

팀 공통 코드 규칙(변수명·`any` 금지·성능)은 Claude Code 에서는 `.claude/rules/coding-standards.md` 로 항상 들어오지만, 자동 주입이 없는 도구(Codex 등)는 `docs/knowledge/common/coding.md` 를 직접 읽어야 한다. `AGENTS.md` 2.2 에 이 차이를 적었다.

## 부록 G. `scripts/delegate.sh` 프롬프트 전달 버그 (실측 중 발견·수정)

실측하려고 에이전트를 띄웠는데 **엉뚱한 답(레포 상태 조사)이 돌아왔다.** 원인은 위임 스크립트였다.

`herdr pane run` 은 인자를 **따옴표 없이 셸 명령줄로 이어붙인다.** 확인 테스트:

```
herdr pane run <pane> printf '[%s]\n' "첫째 단어 둘째 단어. 셋째!"
→ pane 에서 실행된 것:  printf [%s]n 첫째 단어 둘째 단어. 셋째!
→ zsh: no matches found: [%s]n
```

그래서 `delegate.sh` 가 넘긴 프롬프트가 **공백에서 쪼개지고 `( ) !` 가 셸에 먹혀** 에이전트에 제대로 도착하지 않았다. 첫 시도는 `)` 때문에 zsh parse error 로 아예 실행되지 않았고, 두 번째 시도는 실행은 됐지만 에이전트가 프롬프트를 못 받아 "지시가 없다"고 판단하고 레포 상태만 조사했다.

**이 워크스페이스의 모든 위임이 이 경로를 쓴다.** 프롬프트에 공백이 없을 리 없으니 사실상 모든 디스패치가 영향을 받는다.

**수정**: 프롬프트를 임시 파일에 쓰고, 그것을 읽는 러너 스크립트 **한 개**만 `herdr pane run` 에 넘긴다. 인자가 한 단어라 셸 분해가 일어나지 않는다. 러너는 종료 시 임시 파일을 지운다.

수정 후 같은 프롬프트로 재실행해 정상 응답을 받았다(부록 F 가 그 결과다).

## 부록 H. 측정 정정 — 부록 D 는 과대평가였다 (Codex ⑬)

### 무엇이 틀렸나

부록 D 의 "이전" 값에 **경량화 전 프로필 + 변경 후 knowledge** 를 섞어 넣었다. `rules.md` 는 필수 절 신설로 커졌는데 그 커진 값을 "이전"에도 쓴 것이다. 그래서 절감이 실제보다 크게 나왔다.

정정 방법: **양쪽을 각각 고정 ref 에서 읽는다.** 이전은 `c810447~1`(1단계 직전), 이후는 현재 작업 트리.

```
이전 = git show c810447~1:<파일>   (자동 주입 + 경량화 전 프로필 + common/* 전량 + 해당 레포 knowledge 전량)
이후 = 현재 파일                    (자동 주입 + 경량화 후 프로필 + rules.md + gotchas.md [+ 새 화면이면 workflows·patterns·structure])
```

### 정정된 수치

| 에이전트 | 이전 | 국소 수정 | | 새 화면 | |
|---|---:|---:|---:|---:|---:|
| refund-fe | 52,827 | 39,067 | −27% | 56,481 | **+6%** |
| hub-fe | 55,963 | 38,544 | −32% | 57,005 | +1% |
| care-fe | 51,677 | 38,934 | −25% | 52,648 | +1% |
| op-fe | 52,957 | 38,919 | −27% | 55,439 | +4% |
| packages-fe | 55,047 | 39,894 | −28% | 56,812 | +3% |
| bznav-refund-fe | 58,750 | 43,316 | −27% | 59,146 | +0% |
| bznav-care-fe | 59,993 | 42,981 | −29% | 60,026 | +0% |
| bznav-brand-fe | 43,911 | 40,439 | **−8%** | 44,903 | +2% |
| bznav-sena-fe | 48,722 | 41,009 | −16% | 49,642 | +1% |
| bznav-plus-fe | 48,225 | 41,542 | −14% | 49,241 | +2% |
| bznav-packages-fe | 54,615 | 43,611 | −21% | 55,784 | +2% |
| **평균** | **52,971** | **40,750** | **−24%** | **54,284** | **+2%** |

### 이전 보고와의 차이

| | 부록 D (틀림) | 부록 H (정정) |
|---|---|---|
| 국소 수정 | −35% | **−24%** |
| 새 화면 | −10% | **+2% (증가)** |

**목표(단순 수정 30% 감소)를 달성하지 못했다.** 평균 −24% 이고, bznav-brand-fe 는 −8% 에 그친다.

### 왜 이렇게 됐나 — 숨기지 않는다

1. **자동 주입이 18,114 → 28,637 B (+58%)** 로 늘었다. 정책·필수 규칙·재개 절차가 전부 항상 로딩되는 `AGENTS.md`(7,301 → 14,394)에 들어갔다
2. **`rules.md` 가 커졌다.** 특히 `bznav-web/rules.md` 는 7,213 B 이고 **앱 6개가 모두 항상 읽는다.** Codex ① 지적(원문 코드 컨벤션이 필수 절 밖에 있어 국소 수정에서 누락)을 고치느라 `[필수]` 컨벤션을 인라인한 결과다
3. **`gotchas.md` 를 항상 읽도록 승격**했다(사용자 결정). 레포당 2~4 KB 가 상시 추가된다
4. bznav 앱들이 특히 나쁜 것은 위 2·3 이 겹치기 때문이다. brand-web 은 원래 knowledge 가 작아서(43,911) 분모가 작고, 공유 `rules.md` 부담은 똑같이 진다

### 판단

2·3 은 **정확도를 택한 대가이고 되돌리지 않는다.** 되돌리면 refund 의 `deal` 용어, web-op 의 `BaseApiGateway` 금지, bznav 의 named export·`console.log` 금지 같은 규칙이 국소 수정에서 다시 누락된다. 그게 토큰보다 비싸다.

줄일 여지가 있다면 1번이다. `AGENTS.md` 2.4~2.6(정보 신뢰도·Memory·History·재개)은 **헤르메스에게 필요하지 실무 FE 에이전트에게는 대부분 불필요**한데 지금은 모두에게 주입된다. 다만 Claude Code 가 서브에이전트에게 `CLAUDE.md`/`AGENTS.md` 를 통째로 주입하므로(부록 F) 문서를 쪼개지 않는 한 선택적으로 줄일 방법이 없다. **다음 작업으로 남긴다.**

### 측정의 한계 (그대로 둔다)

- **문서 원문 바이트이지 입력 토큰이 아니다.** 토큰 계측 수단이 없다
- 실제 읽기 횟수·재독·재작업 비용은 재지 않았다. 정적 파일 크기 비교다
- "이전" 은 당시 지시("세 층을 순서대로 + 작업 전 patterns·workflows")를 **전량 로딩으로 가정**한 값이다. 실제 에이전트가 매번 전량을 읽었는지는 확인하지 않았다

## 부록 I. Codex 교차검토 13건 처리 결과

`git log c810447~1..` 전체 diff 를 Codex 가 읽고 낸 지적이다. **전건 반영했다.** 액면으로 받지 않고 모두 재현해 본 뒤 고쳤다.

| # | 심각도 | 지적 | 재현 | 처리 |
|---|---|---|---|---|
| ① | 높음 | bznav 원문 `[필수]` 코드 컨벤션이 `rules.md` 필수 절 밖 — 선택 로딩이 만든 회귀 | `named export` 필수절 0회 확인 | 원문 `[필수]` 30여 개 대조 후 자주 걸리는 것을 필수 절에 인라인 |
| ② | 중간 | bznav 3개 프로필에서 build 의무 삭제 | plus·sena `build` 0회 | 원문 §검증 표를 `rules.md` 에 옮기고 프로필 6개에 복구 |
| ③ | 높음 | archive 가 기존 html 을 덮어씀 | 충돌 상황 재현 | 옮기기 전 md·html 둘 다 검사 + 실패 시 md 롤백 |
| ④ | 중간 | archive Status 파싱이 `**done**` 을 못 읽음 | 빈 값 확인 | awk 로 Checkpoint 절만·코드블록 제외·굵게 제거. 경계 6종 검증 |
| ⑤ | 중간 | `delegate.sh` 가 `exec` 때문에 임시 파일 누수 | `trap`+`exec` 재현 | `exec` 제거, 종료 코드 전달 |
| ⑥ | 높음 | `build-derived --check` 가 마커 없어도 exit 0 | exit=0 확인 | 전체 검증 후에만 쓰기, 누락·중복이면 exit 1 |
| ⑦ | 중간 | 마커 밖 검사가 레포별 구분을 못 함 | Next 99.5 로 바꿔도 통과 | 레포 이름이 든 `<tr>` 안에서만 대조. 패키지 레포는 포트 검사 제외 |
| ⑧ | 중간 | `last sync` 를 실행일로 생성 | 날짜 바뀌며 실제로 깨짐 | `.sync/state.json` 의 `acceptedAt` 사용 |
| ⑨ | 중간 | catalog 파서가 따옴표 키 누락 | **33개 중 22개만** 저장 | 따옴표 키·인라인 주석 처리 → 33/33 |
| ⑩ | 중간 | prettier 요약이 주석·override 오인 | 재현됨 | JSON 은 구조 파싱, JS 는 주석 제거 + `overrides` 앞까지만 |
| ⑪ | 중간 | `--repo` 가 pending 을 격리한다는 안내가 틀림 | `sync-fingerprint.mjs:293` 로 확인 | SKILL 에 사실대로 적고 accept 전 `ls .sync/pending/` 절차 추가 |
| ⑫ | 중간 | 계획서 Checkpoint 노후 | Work ref `b50149f`, accept 사실 누락 | 현재 HEAD·accept 사실 반영 |
| ⑬ | 중간 | 부록 D 측정 과대평가 | 재현·재계산 | **부록 H** 로 정정 (국소 −24%, 새 화면 +2%) |

### Codex 가 틀린 것

없다. 13건 모두 실제로 재현됐다. ⑨ 는 Codex 가 "47개 중 11개 누락" 이라 했는데 실제 catalog 블록은 33개였다(47 은 블록 밖까지 센 수). **누락 11개라는 핵심은 맞았다.**

### 이 검토로 알게 된 것

작업 중에 만든 스크립트 4개(`build-derived`·`archive-plans`·`delegate`·`sync-fingerprint`)에서 **결함 7건**이 나왔다. 전부 "정상 경로에서는 동작하지만 실패·경계에서 조용히 잘못되는" 종류다 — 마커가 없어도 통과, 굵게 쓴 Status 를 못 읽음, 따옴표 키를 조용히 버림, 임시 파일 누수. 새 자동화를 넣을 때 정상 경로만 확인하면 이런 것이 남는다.

      <span class="badge scope" id="p-scope"></span>
    </div>
    <a class="md-link" id="p-mdlink" href="#"></a>
  </header>

  <p class="section-title" id="body-title" style="display:none">작업계획서 상세</p>
  <article class="plan-body" id="plan-body" style="display:none"></article>

  <div class="statusbar" id="statusbar"><span class="dot"></span><span id="statusbar-text"></span></div>

  <div id="decisions-wrap">
    <p class="section-title" id="decisions-title">결정 사항 — 선택 후 하단 [프롬프트로 복사]</p>
    <div id="decisions"></div>

    <div class="card" id="notes-card">
      <h3 class="card-title">추가 메모 (선택)</h3>
      <p class="card-desc">결정 외에 전달할 제약·우선순위·주의사항이 있으면 적어주세요.</p>
      <textarea class="notes-area" id="notes" placeholder="예: 마이그레이션은 이번 배포에 포함하지 말 것"></textarea>
    </div>

    <details class="preview">
      <summary>복사될 프롬프트 미리보기</summary>
      <pre class="prompt-out" id="preview"></pre>
    </details>
  </div>
</div>

<div class="actionbar" id="actionbar">
  <div class="actionbar-inner">
    <div class="status" id="status"></div>
    <button id="btn-json">JSON 복사</button>
    <button class="primary" id="btn-copy">프롬프트로 복사</button>
  </div>
</div>
<div class="toast" id="toast">복사되었습니다</div>

<script>
(function () {
  const state = {}; // decisionId -> { picks: Set, custom: '' }

  const el = (tag, cls, html) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (html != null) node.innerHTML = html;
    return node;
  };
  const escapeText = (str) => String(str).replace(/[&<>"]/g, (ch) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

  // decided 값을 배열로 정규화
  const decidedList = (dec) => {
    if (dec.decided == null) return null;
    return Array.isArray(dec.decided) ? dec.decided : [dec.decided];
  };
  const isConfirmed = (dec) => decidedList(dec) !== null;
  // 모든 필수 결정에 decided 가 채워졌는가 → 확정 모드
  const allConfirmed = () => PLAN.decisions.length > 0 &&
    PLAN.decisions.every((dec) => !dec.required || isConfirmed(dec));

  // --- 헤더 렌더 ---
  document.getElementById('p-title').textContent = PLAN.title;
  document.getElementById('p-summary').textContent = PLAN.summary || '';
  const typeBadge = document.getElementById('p-type');
  typeBadge.textContent = PLAN.type;
  typeBadge.classList.add('type-' + PLAN.type);
  document.getElementById('p-scope').textContent = '영향 범위: ' + PLAN.scope;
  const mdLink = document.getElementById('p-mdlink');
  mdLink.innerHTML = '원본 계획서 → <code>' + escapeText(PLAN.mdFile) + '</code>';
  mdLink.href = PLAN.mdFile.split('/').pop();

  // --- 결정 카드 렌더 ---
  const container = document.getElementById('decisions');
  PLAN.decisions.forEach((dec) => {
    const confirmed = isConfirmed(dec);
    const preset = decidedList(dec) || [];
    state[dec.id] = { picks: new Set(preset), custom: '' };

    const card = el('div', 'card' + (confirmed ? ' confirmed' : ''));
    card.dataset.id = dec.id;
    const reqMark = dec.required ? ' *' : '';
    card.appendChild(el('div', 'card-head',
      '<h3 class="card-title">' + escapeText(dec.title) + reqMark + '</h3>' +
      '<span class="pick-tag">' + (dec.type === 'multi' ? '복수 선택' : '택1') + '</span>'));
    if (dec.desc) card.appendChild(el('p', 'card-desc', escapeText(dec.desc)));

    const opts = el('div', 'options');
    dec.options.forEach((opt) => {
      const row = el('div', 'option');
      row.dataset.type = dec.type;
      if (preset.includes(opt.label)) row.classList.add('selected');
      const rec = opt.recommended ? '<span class="rec">추천</span>' : '';
      const desc = opt.desc ? '<div class="opt-desc">' + escapeText(opt.desc) + '</div>' : '';
      const customField = opt.custom
        ? '<input class="custom-input" placeholder="직접 입력" />' : '';
      row.innerHTML =
        '<div class="marker"></div>' +
        '<div class="opt-body"><div class="opt-label">' + escapeText(opt.label) + rec + '</div>' +
        desc + customField + '</div>';
      if (!confirmed) {
        row.addEventListener('click', (ev) => {
          if (ev.target.classList.contains('custom-input')) return;
          toggle(dec, opt, row, opts);
        });
        const customInput = row.querySelector('.custom-input');
        if (customInput) customInput.addEventListener('input', () => {
          state[dec.id].custom = customInput.value;
          render();
        });
      }
      opts.appendChild(row);
    });
    card.appendChild(opts);
    container.appendChild(card);
  });

  function toggle(dec, opt, row, opts) {
    const picks = state[dec.id].picks;
    if (dec.type === 'single') {
      picks.clear();
      opts.querySelectorAll('.option').forEach((node) => node.classList.remove('selected'));
      picks.add(opt.label);
      row.classList.add('selected');
    } else {
      if (picks.has(opt.label)) { picks.delete(opt.label); row.classList.remove('selected'); }
      else { picks.add(opt.label); row.classList.add('selected'); }
    }
    render();
  }

  // --- 선택 결과 → 텍스트 ---
  function valueFor(dec) {
    const st = state[dec.id];
    const labels = [...st.picks].map((label) => {
      const opt = dec.options.find((option) => option.label === label);
      if (opt && opt.custom && st.custom.trim()) return st.custom.trim();
      return label;
    });
    return labels.join(', ');
  }

  function unresolved() {
    return PLAN.decisions.filter((dec) => dec.required && state[dec.id].picks.size === 0);
  }

  function buildPrompt() {
    const lines = [];
    lines.push('[작업계획서 결정사항 확정] ' + PLAN.title);
    lines.push('');
    lines.push('아래 결정사항으로 ' + PLAN.mdFile + ' 계획서를 확정하고 진행해주세요.');
    lines.push('');
    PLAN.decisions.forEach((dec, idx) => {
      const val = valueFor(dec) || '(미결정)';
      lines.push((idx + 1) + '. ' + dec.title + ': ' + val);
    });
    const notes = document.getElementById('notes').value.trim();
    lines.push('');
    lines.push('추가 메모: ' + (notes || '(없음)'));
    return lines.join('\n');
  }

  function buildJson() {
    const obj = { title: PLAN.title, mdFile: PLAN.mdFile, decisions: {}, notes: document.getElementById('notes').value.trim() };
    PLAN.decisions.forEach((dec) => { obj.decisions[dec.title] = valueFor(dec); });
    return JSON.stringify(obj, null, 2);
  }

  function render() {
    PLAN.decisions.forEach((dec) => {
      const card = container.querySelector('[data-id="' + dec.id + '"]');
      const tag = card.querySelector('.pick-tag');
      const decided = state[dec.id].picks.size > 0;
      card.classList.toggle('unresolved', dec.required && !decided && !isConfirmed(dec));
      if (decided) {
        tag.classList.add('done');
        tag.textContent = (isConfirmed(dec) ? '✅ 확정 · ' : '✓ ') + valueFor(dec);
      } else {
        tag.classList.remove('done');
        tag.textContent = dec.type === 'multi' ? '복수 선택' : '택1';
      }
    });
    const left = unresolved();
    const status = document.getElementById('status');
    if (left.length === 0) status.innerHTML = '<b>모든 필수 결정 완료.</b> 복사해서 채팅에 붙여넣으세요.';
    else status.innerHTML = '필수 결정 <b>' + left.length + '개</b> 남음: ' +
      left.map((dec) => escapeText(dec.title)).join(', ');
    document.getElementById('btn-copy').disabled = left.length > 0;
    document.getElementById('preview').textContent = buildPrompt();
  }

  // --- 라이프사이클 UI: 결정 콘솔 / 확정 뷰 전환 ---
  function applyLifecycle() {
    const confirmed = allConfirmed();
    const bar = document.getElementById('statusbar');
    const barText = document.getElementById('statusbar-text');
    if (confirmed) {
      bar.className = 'statusbar confirmed';
      barText.textContent = '✅ 확정 완료 — 위 작업계획서가 확정되었습니다. (아래 결정 카드는 잠금 표시)';
      document.getElementById('decisions-title').textContent = '확정된 결정 사항';
      // 확정되면 메모 입력/미리보기/액션바는 감춰 읽기용으로 전환
      document.getElementById('notes-card').style.display = 'none';
      document.querySelector('details.preview').style.display = 'none';
      document.getElementById('actionbar').style.display = 'none';
      document.querySelector('.wrap').style.paddingBottom = '60px';
    } else {
      bar.className = 'statusbar pending';
      const left = PLAN.decisions.filter((dec) => dec.required && !isConfirmed(dec)).length;
      barText.textContent = '결정 대기 — 필수 ' + left + '건을 선택해 [프롬프트로 복사] 후 채팅에 붙여넣어 주세요.';
    }
  }

  // --- .md 본문 렌더 ---
  renderPlanBody();
  function renderPlanBody() {
    const raw = (document.getElementById('plan-md').textContent || '').trim();
    if (!raw) return;
    document.getElementById('body-title').style.display = '';
    const body = document.getElementById('plan-body');
    body.style.display = '';
    body.innerHTML = miniMarkdown(raw);
  }

  // 의존성 없는 경량 마크다운 렌더러 (중첩목록 미지원)
  function mdEscape(str) {
    return String(str).replace(/[&<>]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[ch]));
  }
  function mdInline(str) {
    let out = mdEscape(str);
    out = out.replace(/`([^`]+)`/g, (m, code) => '<code>' + code + '</code>');
    out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>');
    return out;
  }
  function mdSplitRow(line) {
    return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((cell) => cell.trim());
  }
  function miniMarkdown(src) {
    const lines = src.replace(/\r\n/g, '\n').split('\n');
    let html = '';
    let idx = 0;
    const isSpecial = (line) =>
      /^(#{1,6})\s/.test(line) || /^```/.test(line) || /^\s*\|.*\|\s*$/.test(line) ||
      /^\s*([-*])\s+/.test(line) || /^\s*\d+\.\s+/.test(line) || /^\s*---+\s*$/.test(line) ||
      /^\s*>/.test(line) || /^\s*$/.test(line);

    while (idx < lines.length) {
      const line = lines[idx];

      // 코드 펜스
      if (/^```/.test(line)) {
        idx += 1;
        const buf = [];
        while (idx < lines.length && !/^```/.test(lines[idx])) { buf.push(lines[idx]); idx += 1; }
        idx += 1;
        html += '<pre class="md-code"><code>' + mdEscape(buf.join('\n')) + '</code></pre>';
        continue;
      }
      // 표 (헤더 + 구분선)
      if (/^\s*\|.*\|\s*$/.test(line) && idx + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[idx + 1])) {
        const header = mdSplitRow(line);
        idx += 2;
        const rows = [];
        while (idx < lines.length && /^\s*\|.*\|\s*$/.test(lines[idx])) { rows.push(mdSplitRow(lines[idx])); idx += 1; }
        html += '<table><thead><tr>' + header.map((cell) => '<th>' + mdInline(cell) + '</th>').join('') + '</tr></thead><tbody>';
        html += rows.map((row) => '<tr>' + row.map((cell) => '<td>' + mdInline(cell) + '</td>').join('') + '</tr>').join('');
        html += '</tbody></table>';
        continue;
      }
      // 제목
      const heading = line.match(/^(#{1,6})\s+(.*)$/);
      if (heading) {
        const level = heading[1].length;
        html += '<h' + level + '>' + mdInline(heading[2]) + '</h' + level + '>';
        idx += 1;
        continue;
      }
      // 구분선
      if (/^\s*---+\s*$/.test(line)) { html += '<hr>'; idx += 1; continue; }
      // 인용
      if (/^\s*>\s?/.test(line)) {
        const buf = [];
        while (idx < lines.length && /^\s*>\s?/.test(lines[idx])) { buf.push(lines[idx].replace(/^\s*>\s?/, '')); idx += 1; }
        html += '<blockquote>' + mdInline(buf.join(' ')) + '</blockquote>';
        continue;
      }
      // 목록
      if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
        const ordered = /^\s*\d+\.\s+/.test(line);
        const buf = [];
        while (idx < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[idx])) {
          buf.push(lines[idx].replace(/^\s*([-*]|\d+\.)\s+/, '')); idx += 1;
        }
        const items = buf.map((item) => '<li>' + mdInline(item) + '</li>').join('');
        html += ordered ? '<ol>' + items + '</ol>' : '<ul>' + items + '</ul>';
        continue;
      }
      // 빈 줄
      if (/^\s*$/.test(line)) { idx += 1; continue; }
      // 문단
      const buf = [line];
      idx += 1;
      while (idx < lines.length && !isSpecial(lines[idx])) { buf.push(lines[idx]); idx += 1; }
      html += '<p>' + mdInline(buf.join(' ')) + '</p>';
    }
    return html;
  }

  function copy(text) {
    navigator.clipboard.writeText(text).then(showToast).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove(); showToast();
    });
  }
  let toastTimer;
  function showToast() {
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
  }

  document.getElementById('btn-copy').addEventListener('click', () => copy(buildPrompt()));
  document.getElementById('btn-json').addEventListener('click', () => copy(buildJson()));
  document.getElementById('notes').addEventListener('input', render);

  render();
  applyLifecycle();
})();
</script>
</body>
</html>
