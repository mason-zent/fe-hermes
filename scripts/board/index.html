<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>현황판</title>
<style>
  :root {
    --bg: #f5f3ee; --panel: #ffffff; --line: #e4e0d6; --text: #23211d; --muted: #77726a;
    --accent: #3b6fd8; --ok: #2f9e62; --warn: #c98a12; --bad: #d1463b; --idle: #9a958c;
    --col-issue: #d1463b; --col-plan: #7a62c9; --col-doing: #3b6fd8; --col-review: #c98a12; --col-done: #2f9e62;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16171a; --panel: #1f2125; --line: #2e3137; --text: #e8e6e1; --muted: #9a968e; --idle: #6d6a64; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "Apple SD Gothic Neo", "Pretendard", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 16px; margin: 0; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); display: inline-block; flex: none; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: pulse 1.6s infinite; }
  .dot.off { background: var(--bad); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  /* 실시간 표시에 올리면 말풍선 — 마지막 변화·마지막 sync */
  .live { position: relative; cursor: default; }
  .live .tip { position: absolute; top: calc(100% + 8px); left: 0; display: none; flex-direction: column; gap: 2px; padding: 7px 10px; border-radius: 8px; background: var(--text); color: var(--bg); font-size: 12px; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,.18); z-index: 3; }
  .live .tip::before { content: ''; position: absolute; top: -5px; left: 12px; border: 5px solid transparent; border-top: 0; border-bottom-color: var(--text); }
  .live:hover .tip, .live:focus-visible .tip { display: flex; }
  .live .tip:empty, .live .tip span:empty { display: none; }
  /* 제목 앞 점이 연결 상태 — 정상일 땐 글자 없이 점만, 끊김·다른 탭일 때만 옆에 안내 */
  header h1.live { font-size: 16px; color: var(--text); gap: 8px; line-height: 1; }
  /* 한글 글꼴은 글자가 줄 가운데보다 살짝 위에 그려져 점을 그만큼 올린다 */
  header h1.live .dot { transform: translateY(-1px); }
  .live-note { font-size: 12px; color: var(--muted); }
  .live-note:empty { display: none; }
  .usage { margin-left: auto; display: flex; align-items: stretch; gap: 8px; flex-wrap: wrap; font-size: 12px; }
  .usage[hidden] { display: none; }
  main[hidden] { display: none; }
  .usage .cli { display: flex; align-items: center; gap: 8px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 10px; }
  .usage .cli.stale { opacity: .55; }
  .usage .cli.empty { color: var(--muted); }
  .usage .logo { width: 18px; height: 18px; flex: none; }
  .usage .logo.letter { display: inline-grid; place-items: center; border-radius: 5px; color: #fff; background: var(--idle); font-size: 11px; font-weight: 700; }
  .usage .rows { display: flex; align-items: center; gap: 12px; }
  .usage .none { color: var(--muted); font-size: 11px; }
  .usage .win { display: grid; grid-template-columns: 56px 30px auto; align-items: center; gap: 6px; }
  .usage .win .pct { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  .usage .win .reset { color: var(--muted); white-space: nowrap; }
  .gauge { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .gauge i { display: block; height: 100%; border-radius: 3px; background: var(--ok); transition: width .4s; }
  .gauge i.warn { background: var(--warn); } .gauge i.bad { background: var(--bad); }
  /* 섹션이 내용 폭만큼 늘어나 페이지 전체가 가로로 밀리지 않게 — 넘치는 건 각 영역 안에서만 스크롤 */
  main { padding: 16px 20px 40px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
  main > section { min-width: 0; }
  h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
  /* 카드가 많아져도 한 줄 — 넘치면 가로 스크롤 */
  .agents { display: grid; grid-auto-flow: column; grid-auto-columns: 260px; gap: 10px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; }
  .agents .agent { scroll-snap-align: start; }
  .agent { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; }
  .agent .row { display: flex; align-items: center; gap: 8px; }
  .agent .name { font-weight: 600; }
  .agent .sub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .pill.working { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .pill.blocked, .pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
  .pill.ready { color: #fff; background: var(--ok); border-color: var(--ok); }
  .checks { font-size: 12px; color: var(--muted); display: grid; gap: 1px; }
  .checks .ok { color: var(--ok); }
  .pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
  .empty { color: var(--muted); font-size: 13px; padding: 10px 2px; }
  .board { display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 12px; align-items: start; overflow-x: auto; }
  .col { background: color-mix(in srgb, var(--panel) 55%, var(--bg)); border: 1px solid var(--line); border-radius: 12px; padding: 10px; min-height: 120px; }
  .col-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-weight: 600; font-size: 13px; }
  .col-head .bar { width: 4px; height: 14px; border-radius: 2px; }
  .col-head .count { margin-left: auto; color: var(--muted); font-weight: 500; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; margin-bottom: 8px; display: grid; gap: 5px; }
  .card.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { from { box-shadow: 0 0 0 2px var(--accent); } to { box-shadow: 0 0 0 0 transparent; } }
  .card .title { font-weight: 600; line-height: 1.35; }
  .card .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .card .line { font-size: 12px; color: var(--muted); }
  .card .line b { color: var(--text); font-weight: 600; }
  .card a { color: var(--accent); text-decoration: none; font-size: 12px; }
  .progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--col-doing); }
  .worktrees { display: flex; flex-wrap: wrap; gap: 8px; }
  .wt { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; }
  .card[draggable="true"] { cursor: grab; }
  .card.dragging { opacity: .45; }
  .col.drop { outline: 2px dashed var(--accent); outline-offset: -4px; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  button, select, textarea { font: inherit; color: inherit; }
  .btn { font-size: 12px; padding: 3px 9px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .steps { display: grid; gap: 3px; margin-top: 8px; font-size: 12px; }
  .steps .done { color: var(--ok); } .steps .running { color: var(--accent); } .steps .error { color: var(--bad); } .steps .warn { color: var(--warn); } .steps .wait, .steps .skip { color: var(--muted); }
  .btn.danger { color: var(--bad); border-color: transparent; background: transparent; margin-left: auto; }
  .btn.danger:hover { border-color: var(--bad); }
  .card .title { cursor: pointer; }
  .card .title:hover { color: var(--accent); }
  #detail { width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 64px); }
  #detail .body { overflow-y: auto; max-height: calc(100vh - 190px); padding-right: 4px; }
  #detail h4 { margin: 14px 0 6px; font-size: 13px; color: var(--muted); }
  .part { margin-top: 16px; padding-top: 12px; border-top: 2px solid var(--line); }
  .part > .p-head { display: flex; align-items: baseline; gap: 8px; font-size: 14px; font-weight: 700; }
  .part > .p-head small { font-weight: 400; font-size: 11.5px; color: var(--muted); }
  .part.issue > .p-head { color: var(--col-issue); }
  .part.plan > .p-head { color: var(--col-plan); }
  .pill.kind-bundle { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); font-weight: 600; }
  #detail ol, #detail ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 13px; }
  #detail li.done { color: var(--ok); } #detail li.open { color: var(--text); }
  #detail .md { font-size: 13px; line-height: 1.6; }
  #detail .md p { margin: 4px 0; }
  #detail code { font-size: 12px; background: var(--bg); padding: 1px 4px; border-radius: 4px; }
  #detail pre { font-size: 12px; background: var(--bg); padding: 8px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; }
  .btn:disabled { opacity: .5; cursor: progress; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text); width: min(640px, calc(100vw - 32px)); padding: 16px; }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h3 { margin: 0 0 6px; font-size: 15px; }
  dialog textarea { width: 100%; min-height: 130px; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); line-height: 1.5; }
  dialog .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  /* 탭 — 현황 / 히스토리 */
  .tabs { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .tabs button { font: inherit; font-size: 12.5px; padding: 3px 12px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* 히스토리 */
  .history-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .history-bar input, .history-bar select { font: inherit; font-size: 13px; padding: 5px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--text); }
  .history-bar input { flex: 1 1 240px; min-width: 0; }
  .history { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; }
  .history .month { font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: .04em; padding: 8px 14px 4px; background: var(--bg); border-top: 1px solid var(--line); }
  /* 날짜 머리글 — 누르면 그날 목록을 접고 편다 */
  .history button.month { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; font-family: inherit; border-left: 0; border-right: 0; border-bottom: 0; cursor: pointer; }
  .history button.month:hover { color: var(--text); }
  .history button.month:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .history .month .caret { width: 10px; font-size: 9px; }
  .history .month .n { font-weight: 500; }
  .history .month:first-child { border-top: 0; }
  .h-row { display: grid; grid-template-columns: 92px minmax(0, 1fr) 96px; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); cursor: pointer; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; font: inherit; color: inherit; width: 100%; }
  .history .month + .h-row { border-top: 0; }
  .h-row:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .h-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .h-date { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 1px; }
  .h-main { min-width: 0; display: grid; gap: 3px; }
  .h-owner { font-size: 12px; color: var(--muted); padding-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .h-title { font-weight: 600; font-size: 13.5px; }
  .h-sum { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .h-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .pill.kind-issue { color: var(--col-issue); border-color: color-mix(in srgb, var(--col-issue) 40%, transparent); }
  .formal-mark { margin-right: 4px; font-size: 13px; cursor: default; }
  .pill.kind-plan { color: var(--col-plan); border-color: color-mix(in srgb, var(--col-plan) 40%, transparent); }
  .empty-history { padding: 28px 16px; text-align: center; color: var(--muted); font-size: 13px; }
  .history-wrap { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 14px; align-items: start; }
  .h-tree { position: sticky; top: 70px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 6px; display: grid; gap: 1px; max-height: calc(100vh - 110px); overflow-y: auto; }
  .h-node { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; font: inherit; font-size: 13px; color: var(--text); background: none; border: 0; border-radius: 6px; padding: 5px 8px; cursor: pointer; }
  .h-node:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
  .h-node:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .h-node[aria-current="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-weight: 600; }
  .h-node .caret { width: 12px; flex: none; color: var(--muted); font-size: 10px; }
  .h-node .n { margin-left: auto; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .h-node.lv-all { font-weight: 600; }
  .h-node.lv-month { padding-left: 22px; }
  .h-node.lv-day { padding-left: 40px; font-size: 12.5px; }
  .h-crumb { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  .h-crumb b { color: var(--text); }
  @media (max-width: 720px) { .history-wrap { grid-template-columns: minmax(0, 1fr); } .h-tree { position: static; max-height: 240px; } }
  @media (max-width: 720px) { .h-row { grid-template-columns: minmax(0, 1fr); gap: 4px; } }
  @media (max-width: 720px) { header { flex-wrap: wrap; } .usage { margin-left: 0; } main { padding: 12px 16px 32px; } }
</style>
</head>
<body>
<header>
  <h1 class="live" tabindex="0"><span id="live-dot" class="dot"></span>현황판
    <span class="tip" role="tooltip"><span id="live-state"></span><span id="updated"></span><span id="sync"></span></span></h1>
  <nav class="tabs" role="tablist" aria-label="보기">
    <button type="button" role="tab" id="tab-now" data-tab="now" aria-selected="true">현황</button>
    <button type="button" role="tab" id="tab-history" data-tab="history" aria-selected="false">히스토리</button>
  </nav>
  <span class="live-note" id="live-text">연결 중…</span>
  <div class="usage" id="usage" hidden></div>
</header>
<main id="view-now">
  <section>
    <h2>지금 동작 중</h2>
    <div id="agents" class="agents"></div>
  </section>
  <section>
    <h2>칸반</h2>
    <div id="board" class="board"></div>
  </section>
  <section>
    <h2>워크트리 (.worktrees)</h2>
    <div id="worktrees" class="worktrees"></div>
  </section>
</main>
<main id="view-history" hidden>
  <section>
    <h2>히스토리 — 보관한 일 (archive/, git 에 남아요)</h2>
    <div class="history-bar">
      <select id="history-kind" aria-label="종류"><option value="">전체</option><option value="issue">이슈</option><option value="plan">계획서만</option></select>
      <select id="history-repo" aria-label="레포"><option value="">모든 레포</option></select>
      <select id="history-owner" aria-label="작업자"><option value="">모든 작업자</option></select>
      <input id="history-q" type="search" placeholder="제목·요약·레포·작업자·커밋으로 찾기" aria-label="히스토리 검색">
    </div>
    <div class="history-wrap">
      <nav class="h-tree" id="history-tree" aria-label="기간"></nav>
      <div class="h-listbox">
        <div class="h-crumb" id="history-crumb"></div>
        <div id="history" class="history"><div class="empty-history">불러오는 중이에요…</div></div>
      </div>
    </div>
  </section>
</main>
<dialog id="ask">
  <h3 id="ask-title">헤르메스에게 보내기</h3>
  <div class="line" id="ask-to" style="font-size:12px;color:var(--muted);margin-bottom:8px"></div>
  <textarea id="ask-text"></textarea>
  <div class="line" id="ask-status" style="font-size:12px;margin-top:8px;min-height:18px"></div>
  <div class="row"><button class="btn" id="ask-cancel">취소</button><button class="btn primary" id="ask-send">보내기</button></div>
</dialog>
<dialog id="confirm">
  <h3 id="confirm-title"></h3>
  <div class="line" id="confirm-message" style="font-size:13px;margin-bottom:6px"></div>
  <div class="steps" id="confirm-items"></div>
  <div class="row"><button class="btn" id="confirm-no">취소</button><button class="btn primary" id="confirm-yes"></button></div>
</dialog>
<dialog id="detail">
  <h3 id="detail-title"></h3>
  <div class="line" id="detail-meta" style="font-size:12px;color:var(--muted)"></div>
  <div class="body" id="detail-body"></div>
  <div class="row"><button class="btn" id="detail-close">닫기</button></div>
</dialog>
<div class="toast" id="toast"></div>
<script>
  const TOKEN = '__BOARD_TOKEN__';
  const BOOT = '__BOARD_BOOT__';
  const COLUMNS = [
    ['issue', '이슈', 'var(--col-issue)'],
    ['plan', '계획', 'var(--col-plan)'],
    ['doing', '진행 중', 'var(--col-doing)'],
    ['review', '리뷰', 'var(--col-review)'],
    ['done', '완료', 'var(--col-done)'],
  ];
  const STATUS_LABEL = { working: '작업 중', idle: '대기', blocked: '입력 대기', done: '끝남', unknown: '?' };
  const esc = (value) => String(value ?? '').replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);
  const ago = (sec) => (sec < 60 ? `${sec}초 전` : sec < 3600 ? `${Math.round(sec / 60)}분 전` : `${Math.round(sec / 3600)}시간 전`);
  // 카드 시각 — 오늘이면 시:분, 올해면 월/일 시:분, 그 전이면 연/월/일
  const clock = (ms) => {
    const date = new Date(ms);
    const time = date.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
    const today = new Date();
    if (date.toDateString() === today.toDateString()) return `오늘 ${time}`;
    if (date.getFullYear() === today.getFullYear()) return `${date.getMonth() + 1}/${date.getDate()} ${time}`;
    return `${date.getFullYear()}/${date.getMonth() + 1}/${date.getDate()}`;
  };
  const since = (ms) => {
    const sec = Math.max(0, Math.round((Date.now() - ms) / 1000));
    if (sec < 86_400) return ago(sec);
    return `${Math.round(sec / 86_400)}일 전`;
  };
  // 시작(파일이 생긴 때) · 최근 진행(마지막 수정). 이슈에 계획서가 붙어 있으면 둘 중 늦은 수정 시각
  const when = (card) => {
    const created = card.created || card.mtime;
    const touched = Math.max(card.mtime || 0, card.linkedPlan?.mtime || 0);
    const full = (ms) => new Date(ms).toLocaleString('ko-KR', { hour12: false });
    // 작업자 — 이슈는 연결된 계획서의 작업자가 우선, 없으면 이슈를 올린 사람

  };
  let previous = new Map();
  let lastState = null;
  let targetPane = '';

  // 카드 상태별 액션 — 헤르메스에게 보낼 지시문 초안. 보내기 전에 창에서 고칠 수 있다
  // 이슈 [처리 시작] 에서 "담당 에이전트로 바로(조사만)" 를 고르면 쓰는 지시문 — 운영 기준 detached 워크트리에서 조사만, 코드 수정 없음
  const INVESTIGATE = (card) => `${card.id} 이슈를 맡는다. 순서대로 한다: ① git status --short --branch 로 담당 레포의 현재 브랜치·미커밋 변경을 먼저 보고한다(체크아웃·stash 하지 않는다) ② 이슈의 근거를 기준 ref 에서 git show·ls-tree 로 확인한다 ③ ${card.type === 'check' ? '확인 결과를 이슈 파일 끝에 "## 확인 결과 (날짜 · 에이전트)" 절로 파일:줄 근거와 함께 적는다' : '원인과 고칠 범위를 정리해 보고한다 — 코드는 수정하지 않는다(계획서 승인 뒤 헤르메스가 브랜치를 만들어 다시 맡긴다)'}. 이슈 파일 말고는 수정하지 않는다. 커밋하지 않는다.`;
  const ACTIONS = {
    issue: {
      // 헤르메스가 직접 하지 않는다 — 라우팅 → 브랜치 확인 → 담당 에이전트 pane 디스패치 순서를 지시문에 박는다
      // 기본은 헤르메스가 처리한다(판단 → 계획서 → prBase 브랜치 → 담당 에이전트). 팝업에서 "담당 에이전트로 바로(조사만)" 로 바꿀 수 있다
      open: [['처리 시작', (card) => `${card.id} 이슈를 처리해줘. 이슈를 읽고 담당 레포·에이전트를 확인한 뒤 경량/정식을 판단해 📋 한 줄로 알리고 계획서를 만들어 이슈 plan: 에 연결한다. 대상 레포의 브랜치·미커밋 상태를 보고하고 내 확인을 받은 뒤 scripts/new-branch.sh 로 prBase 에서 작업 브랜치·워크트리를 만들어 담당 에이전트를 그 레포 workspace pane 에 띄운다(scripts/delegate.sh --cwd --plan). 이슈는 운영 기준 ref 에서 찾은 것이니 prBase 에서도 그대로인지 먼저 확인하게 한다. 헤르메스가 직접 코드를 고치지 않는다.`, 'issue']],
      planned: [['계획 보기', (card) => `${card.id} 이슈에 연결된 계획서${card.plan ? ` ${card.plan}` : ''} 상태를 알려줘.`]],
      in_progress: [['진행 상황', (card) => `${card.id} 이슈 진행 상황을 알려줘.`]],
    },
    plan: {
      planned: [['진행 지시', (card) => `${card.id} 계획서대로 진행하자. 결정 사항이 확정됐는지, 대상 레포 브랜치·미커밋 상태를 먼저 확인해 보고하고, 내 확인 뒤 scripts/new-branch.sh 로 워크트리를 만들어 담당 에이전트를 그 레포 workspace pane 에 띄워줘(scripts/delegate.sh --cwd). 헤르메스가 직접 코드를 고치지 않는다.`]],
      in_progress: [['이어서 진행', (card) => `${card.id} Checkpoint 를 읽고, Work ref 와 현재 워크트리 브랜치·diff 가 맞는지 먼저 확인해 보고해줘. 맞으면 Next 를 담당 에이전트 pane 에 이어서 지시한다.`]],
      blocked: [['막힌 것 풀기', (card) => `${card.id} 가 막혀 있다(${card.blocked}). 무엇이 필요한지 정리해줘.`]],
      // 헤르메스를 거치지 않는다 — reviewer 를 계획서의 담당 레포 workspace(워크트리)에 바로 띄운다
      ready_for_review: [['리뷰 요청', (card) => `이 계획서를 검증해 줘. 계획서의 지시·결정 대비 구현이 맞는지, 담당 레포 rules.md 필수 절·gotchas 를 지켰는지, 범위 밖 변경은 없는지 본다. 검증 스크립트를 돌려(워크트리면 HERMES_VERIFY_DIR) 출력 표를 붙이고, 계획서 ## Commits 가 있으면 그 커밋과 origin/<prBase>...HEAD 도 본다. 읽기 전용. 보고는 AGENTS.md 6절 형식 + 발견 사항 [심각|중간|낮음] 파일:줄 — 문제 / 근거 / 고칠 것.`, 'review']],
    },
  };

  const api = async (path, body) => {
    const response = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Board-Token': TOKEN }, body: JSON.stringify(body) });
    const result = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(result.error || response.status);
    return result;
  };
  const toast = (message) => {
    const element = document.getElementById('toast');
    element.textContent = message;
    element.classList.add('show');
    setTimeout(() => element.classList.remove('show'), 2200);
  };
  // ── 카드 상세: 요청한 것 · 진행 · 결과 · 검증/다음 ─────────────────
  const section = (text, heading) => {
    const match = text.match(new RegExp(`^#{2,3}\\s*${heading}[^\\n]*\\n([\\s\\S]*?)(?=^#{1,3} |$(?![\\s\\S]))`, 'm'));
    return match ? match[1].trim() : '';
  };
  const inline = (value) => esc(value).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  const markdown = (text) => {
    if (!text) return '<p style="color:var(--muted)">비어 있어요</p>';
    const out = [];
    let list = null;
    let table = [];
    const flush = () => {
      if (list) { out.push(`<ul>${list.join('')}</ul>`); list = null; }
      if (table.length) { out.push(`<pre>${esc(table.join('\n'))}</pre>`); table = []; }
    };
    for (const raw of text.split('\n')) {
      const line = raw.replace(/\s+$/, '');
      if (/^\s*\|/.test(line)) { if (list) { out.push(`<ul>${list.join('')}</ul>`); list = null; } table.push(line); continue; }
      if (table.length) { out.push(`<pre>${esc(table.join('\n'))}</pre>`); table = []; }
      const item = line.match(/^(\s*)[-*]\s+(\[[ xX]\]\s*)?(.*)$/) || line.match(/^(\s*)\d+\.\s+()(.*)$/);
      if (item) {
        const checked = item[2] ? /x/i.test(item[2]) : null;
        (list ||= []).push(`<li class="${checked === true ? 'done' : checked === false ? 'open' : ''}" style="margin-left:${Math.min(item[1].length, 6) * 6}px">${checked === true ? '✓ ' : checked === false ? '○ ' : ''}${inline(item[3])}</li>`);
        continue;
      }
      flush();
      if (/^#{1,6}\s/.test(line)) out.push(`<p><b>${inline(line.replace(/^#+\s*/, ''))}</b></p>`);
      else if (line.trim()) out.push(`<p>${inline(line)}</p>`);
    }
    flush();
    return `<div class="md">${out.join('')}</div>`;
  };
  // 요청한 것: '## 지시' 의 인용(>) 을 빈 줄 기준으로 나눠 번호를 매긴다
  const requests = (text) => {
    const body = section(text, '지시');
    const blocks = body.split(/\n\s*>?\s*\n/).map((block) => block.split('\n').map((line) => line.replace(/^>\s?/, '')).join(' ').trim()).filter(Boolean);
    if (!blocks.length) return '<p style="color:var(--muted)">아직 요청이 없어요</p>';
    return `<ol>${blocks.map((block) => `<li>${inline(block)}</li>`).join('')}</ol>`;
  };
  const planBlocks = (text) => `
      <h4>요청한 것</h4>${requests(text)}
      <h4>진행</h4>${markdown(section(text, 'Progress'))}
      <h4>결과</h4>${markdown(section(text, '결과'))}
      <h4>검증</h4>${markdown(section(text, 'Validation'))}
      <h4>다음</h4>${markdown(section(text, 'Next'))}`;
  const openDetail = async (id) => {
    const dialog = document.getElementById('detail');
    document.getElementById('detail-title').textContent = '불러오는 중이에요…';
    document.getElementById('detail-meta').textContent = id;
    document.getElementById('detail-body').innerHTML = '';
    dialog.showModal();
    try {
      const response = await fetch(`/api/card?id=${encodeURIComponent(id)}`);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || response.status);
      const title = data.text.match(/^title:\s*"?(.+?)"?\s*$/m)?.[1] || data.text.match(/^#\s+(.+)$/m)?.[1] || id;
      document.getElementById('detail-title').textContent = title;
      if (id.startsWith('issues/')) {
        const body = data.text.replace(/^---[\s\S]*?---\s*/, '');
        document.getElementById('detail-meta').textContent = `${id}${data.plan ? ` · 계획 ${data.plan.id}` : ''}`;
        document.getElementById('detail-body').innerHTML = `<h4>이슈</h4>${markdown(body)}${data.plan ? planBlocks(data.plan.text) : ''}`;
      } else {
        document.getElementById('detail-body').innerHTML = planBlocks(data.text);
      }
    } catch (error) {
      document.getElementById('detail-title').textContent = '불러오지 못했어요';
      document.getElementById('detail-body').innerHTML = `<p>${esc(error.message)}</p>`;
    }
  };
  document.getElementById('detail-close').onclick = () => document.getElementById('detail').close();

  // ── 히스토리 ──────────────────────────────────────────────────────────
  let historyItems = [];
  // 트리에서 고른 기간 — '' 전체 · 'YYYY' · 'YYYY-MM' · 'YYYY-MM-DD'. 펼친 연·월은 open 에
  let historyPick = '';
  const historyOpen = new Set();
  const historyFolded = new Set(); // 목록에서 접은 날짜(YYYY-MM-DD)
  const commitsBlock = (text) => {
    const lines = section(text, 'Commits');
    return lines ? `<h4>커밋</h4>${markdown(lines)}` : '';
  };
  // 히스토리 한 묶음 — 확정한 결정 · 리뷰 뒤 결정 · 리뷰 결론(계획서에 쌓인 '- Review result:' 줄, 적힌 순서대로)
  const decisionsBlock = (text) => {
    const decided = section(text, 'Decisions');
    const afterReview = section(text, '리뷰 뒤 결정');
    return (decided ? `<h4>결정</h4>${markdown(decided)}` : '') + (afterReview ? `<h4>리뷰 뒤 결정</h4>${markdown(afterReview)}` : '');
  };
  const reviewsBlock = (text) => {
    const lines = text.split('\n').filter((line) => /^\s*-\s*Review result:/.test(line)).map((line) => line.replace(/^\s*-\s*Review result:\s*/, '- '));
    return lines.length ? `<h4>리뷰</h4>${markdown(lines.join('\n'))}` : '';
  };
  const openHistory = async (dir) => {
    const dialog = document.getElementById('detail');
    document.getElementById('detail-title').textContent = '불러오는 중이에요…';
    document.getElementById('detail-meta').textContent = dir;
    document.getElementById('detail-body').innerHTML = '';
    dialog.showModal();
    try {
      const response = await fetch(`/api/history/item?dir=${encodeURIComponent(dir)}`);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || response.status);
      const item = historyItems.find((entry) => entry.dir === dir);
      document.getElementById('detail-title').textContent = item?.title || data.meta?.title || dir;
      document.getElementById('detail-meta').textContent = `보관 ${data.meta?.archivedAt || '?'}`;
      const issueBody = data.issue ? `<div class="part issue" id="part-issue"><div class="p-head">📄 이슈 <small>${esc(dir)}/issue.md</small></div>${markdown(data.issue.replace(/^---[\s\S]*?---\s*/, ''))}</div>` : '';
      // 결정 콘솔(plan.html)이 묶여 있으면 읽기 전용으로 연다 — 토큰을 넣지 않아 보낼 수 없다. dir 은 이미 archive/<이름>
      const consoleLink = data.html ? ` <a href="/${dir.split('/').map(encodeURIComponent).join('/')}/plan.html" target="_blank">결정 콘솔 열기 ↗</a>` : '';
      const planBody = data.plan ? `<div class="part plan" id="part-plan"><div class="p-head">📋 계획서 <small>${esc(dir)}/plan.md</small>${consoleLink}</div>${planBlocks(data.plan)}${decisionsBlock(data.plan)}${reviewsBlock(data.plan)}${commitsBlock(data.plan)}</div>` : '';
      const body = document.getElementById('detail-body');
      body.innerHTML = issueBody + planBody;
    } catch (error) {
      document.getElementById('detail-title').textContent = '불러오지 못했어요';
      document.getElementById('detail-body').innerHTML = `<p>${esc(error.message)}</p>`;
    }
  };
  // 무엇이 묶여 있나 — 이슈+계획서 / 이슈만 / 계획서만
  const bundlePill = (item) => {
    const has = item.files || {};
    if (has.issue && has.plan) return '<span class="pill kind-bundle">📎 이슈+계획서</span>';
    if (has.issue) return '<span class="pill kind-issue">📄 이슈만</span>';
    return '<span class="pill kind-plan">📋 계획서만</span>';
  };
  const monthName = (key) => `${Number(key.slice(5, 7))}월`;
  const dayName = (key) => `${Number(key.slice(8, 10))}일`;
  const pickLabel = (key) => {
    if (!key) return '전체';
    if (key.length === 4) return `${key}년`;
    if (key.length === 7) return `${key.slice(0, 4)}년 ${monthName(key)}`;
    return `${key.slice(0, 4)}년 ${monthName(key)} ${dayName(key)}`;
  };
  // 연 → 월 → 일 건수. 검색·필터가 걸린 목록 기준이라 트리 숫자도 같이 바뀐다
  const buildTree = (items) => {
    const years = new Map();
    for (const item of items) {
      const day = (item.archivedAt || '').slice(0, 10);
      if (day.length < 10) continue;
      const year = years.get(day.slice(0, 4)) || { count: 0, months: new Map() };
      const month = year.months.get(day.slice(0, 7)) || { count: 0, days: new Map() };
      year.count += 1;
      month.count += 1;
      month.days.set(day, (month.days.get(day) || 0) + 1);
      year.months.set(day.slice(0, 7), month);
      years.set(day.slice(0, 4), year);
    }
    return [...years.entries()].sort((left, right) => right[0].localeCompare(left[0]));
  };
  const node = (key, label, count, level, openable) => {
    let caret = '';
    if (openable) caret = historyOpen.has(key) ? '▾' : '▸';
    return `<button type="button" class="h-node lv-${level}" data-pick="${esc(key)}" aria-current="${historyPick === key}"${openable ? ` aria-expanded="${historyOpen.has(key)}"` : ''}><span class="caret">${caret}</span>${esc(label)}<span class="n">${count}</span></button>`;
  };
  const renderTree = (items) => {
    const tree = buildTree(items);
    const rows = [node('', '전체', items.length, 'all', false)];
    for (const [year, yearData] of tree) {
      rows.push(node(year, `${year}년`, yearData.count, 'year', true));
      if (!historyOpen.has(year)) continue;
      for (const [month, monthData] of [...yearData.months.entries()].sort((left, right) => right[0].localeCompare(left[0]))) {
        rows.push(node(month, monthName(month), monthData.count, 'month', true));
        if (!historyOpen.has(month)) continue;
        for (const [day, count] of [...monthData.days.entries()].sort((left, right) => right[0].localeCompare(left[0]))) rows.push(node(day, dayName(day), count, 'day', false));
      }
    }
    const box = document.getElementById('history-tree');
    box.innerHTML = rows.join('');
    box.querySelectorAll('[data-pick]').forEach((button) => {
      button.onclick = () => {
        const key = button.dataset.pick;
        // 연·월은 누르면 고르고 펼친다. 이미 고른 걸 다시 누르면 접는다
        if (key.length === 4 || key.length === 7) {
          if (historyPick === key && historyOpen.has(key)) historyOpen.delete(key);
          else historyOpen.add(key);
        }
        historyPick = key;
        renderHistory();
      };
    });
  };
  const renderHistory = () => {
    const box = document.getElementById('history');
    const query = document.getElementById('history-q').value.trim().toLowerCase();
    const kind = document.getElementById('history-kind').value;
    const repo = document.getElementById('history-repo').value;
    const owner = document.getElementById('history-owner').value;
    const filtered = historyItems.filter((item) => {
      if (kind && item.kind !== kind) return false;
      if (repo && item.repo !== repo) return false;
      if (owner && item.owner !== owner) return false;
      if (!query) return true;
      return [item.title, item.summary, item.repo, item.owner, item.dir, ...(item.commits || [])].join(' ').toLowerCase().includes(query);
    });
    renderTree(filtered);
    const shown = filtered.filter((item) => (item.archivedAt || '').startsWith(historyPick));
    document.getElementById('history-crumb').innerHTML = `<b>${esc(pickLabel(historyPick))}</b> · ${shown.length}건`;
    if (!historyItems.length) { box.innerHTML = '<div class="empty-history">아직 보관한 일이 없어요. 완료 칸 카드의 [아카이브]를 누르면 여기로 와요.</div>'; return; }
    if (!shown.length) { box.innerHTML = '<div class="empty-history">이 기간에 맞는 일이 없어요</div>'; return; }
    // 목록은 날짜(일)별로 머리글을 단다 — 머리글을 누르면 그날 목록을 접는다
    const perDay = new Map();
    for (const item of shown) {
      const day = (item.archivedAt || '').slice(0, 10);
      perDay.set(day, (perDay.get(day) || 0) + 1);
    }
    let lastDay = null;
    box.innerHTML = shown.map((item) => {
      const day = (item.archivedAt || '').slice(0, 10);
      const folded = historyFolded.has(day);
      const head = day !== lastDay
        ? `<button type="button" class="month" data-day="${esc(day)}" aria-expanded="${!folded}"><span class="caret">${folded ? '▶' : '▼'}</span>${esc(pickLabel((lastDay = day)) || '날짜 없음')}<span class="n">· ${perDay.get(day)}건</span></button>`
        : '';
      if (folded) return head;
      const tags = [
        bundlePill(item),
        item.repo ? `<span class="pill">${esc(item.repo)}</span>` : '',
        item.planType && item.planType !== 'task' ? `<span class="pill">${esc(item.planType)}</span>` : '',
        item.severity ? `<span class="pill ${item.severity === 'high' ? 'bad' : ''}">${esc(item.severity)}</span>` : '',
        item.status ? `<span class="pill">${esc(item.status)}</span>` : '',
        item.commits?.length ? `<span class="pill">커밋 ${item.commits.length}</span>` : '',
        item.fix ? `<span class="pill">fix ${esc(item.fix)}</span>` : '',
        item.pr ? `<span class="pill">PR #${esc(item.pr)}</span>` : '',
      ].join('');
      return `${head}<button type="button" class="h-row" data-dir="${esc(item.dir)}">
        <span class="h-date">${esc((item.archivedAt || '').slice(11, 16))}</span>
        <span class="h-main"><span class="h-title">${esc(item.title)}</span>${item.summary ? `<span class="h-sum">${esc(item.summary)}</span>` : ''}<span class="h-tags">${tags}</span></span>
        <span class="h-owner" title="작업자">${esc(item.owner || '')}</span>
      </button>`;
    }).join('');
    box.querySelectorAll('button.month').forEach((head) => {
      head.onclick = () => {
        const day = head.dataset.day;
        if (historyFolded.has(day)) historyFolded.delete(day); else historyFolded.add(day);
        renderHistory();
      };
    });
    box.querySelectorAll('.h-row').forEach((row) => { row.onclick = () => openHistory(row.dataset.dir); });
  };
  const loadHistory = async () => {
    try {
      const response = await fetch('/api/history');
      historyItems = (await response.json()).items || [];
    } catch (error) {
      document.getElementById('history').innerHTML = `<div class="empty-history">불러오지 못했어요 — ${esc(error.message)}</div>`;
      return;
    }
    const select = document.getElementById('history-repo');
    const current = select.value;
    const repos = [...new Set(historyItems.map((item) => item.repo).filter(Boolean))].sort();
    select.innerHTML = '<option value="">모든 레포</option>' + repos.map((name) => `<option ${name === current ? 'selected' : ''}>${esc(name)}</option>`).join('');
    const ownerSelect = document.getElementById('history-owner');
    const currentOwner = ownerSelect.value;
    const owners = [...new Set(historyItems.map((item) => item.owner).filter(Boolean))].sort();
    ownerSelect.innerHTML = '<option value="">모든 작업자</option>' + owners.map((name) => `<option ${name === currentOwner ? 'selected' : ''}>${esc(name)}</option>`).join('');
    const latest = historyItems.map((item) => item.archivedAt || '').sort().pop() || '';
    if (latest && !historyOpen.size) { historyOpen.add(latest.slice(0, 4)); historyOpen.add(latest.slice(0, 7)); }
    renderHistory();
  };
  // 검색·필터를 바꾸면 날짜 선택은 전체로 — 고른 기간에 걸려 결과가 비어 보이지 않게
  ['history-q', 'history-kind', 'history-repo', 'history-owner'].forEach((id) => document.getElementById(id).addEventListener('input', () => {
    historyPick = '';
    renderHistory();
  }));
  const showTab = (tab) => {
    const isHistory = tab === 'history';
    document.getElementById('view-now').hidden = isHistory;
    document.getElementById('view-history').hidden = !isHistory;
    document.getElementById('tab-now').setAttribute('aria-selected', String(!isHistory));
    document.getElementById('tab-history').setAttribute('aria-selected', String(isHistory));
    if (isHistory) loadHistory();
    try { history.replaceState(null, '', isHistory ? '#history' : location.pathname); } catch (error) { /* 무시 */ }
  };
  document.querySelectorAll('.tabs [data-tab]').forEach((button) => { button.onclick = () => showTab(button.dataset.tab); });
  if (location.hash === '#history') showTab('history');

  // 팝업 바깥(배경)을 누르면 그 팝업의 취소·닫기 버튼을 누른 것과 같게 — 안에서 드래그하다 밖에서 뗀 건 무시
  document.querySelectorAll('dialog').forEach((dialog) => {
    const isOutside = (event) => {
      const rect = dialog.getBoundingClientRect();
      return event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom;
    };
    let pressedOutside = false;
    dialog.addEventListener('mousedown', (event) => { pressedOutside = event.target === dialog && isOutside(event); });
    dialog.addEventListener('click', (event) => {
      if (!pressedOutside || event.target !== dialog || !isOutside(event)) return;
      dialog.querySelector('.row .btn:not(.primary)')?.click();
    });
  });

  // 브라우저 기본 confirm 대신 현황판 안의 확인 창 — 무엇이 남았는지 ✓/✗ 로 보여 준다
  const askConfirm = ({ title, message = '', items = [], yes }) =>
    new Promise((resolve) => {
      const dialog = document.getElementById('confirm');
      document.getElementById('confirm-title').textContent = title;
      document.getElementById('confirm-message').textContent = message;
      document.getElementById('confirm-items').innerHTML = items.map((item) => `<span class="${item.ok ? 'done' : 'error'}">${item.ok ? '✓' : '✗'} ${esc(item.label)}</span>`).join('');
      document.getElementById('confirm-yes').textContent = yes;
      const finish = (answer) => { dialog.close(); resolve(answer); };
      document.getElementById('confirm-yes').onclick = () => finish(true);
      document.getElementById('confirm-no').onclick = () => finish(false);
      dialog.oncancel = () => resolve(false);
      dialog.showModal();
    });

  const moveTo = async (id, column) => {
    // 완료는 사람이 옮긴다 — 조건이 덜 찼으면 무엇이 남았는지 보여 주고 한 번 더 묻는다
    const target = (lastState?.cards || []).find((entry) => entry.id === id);
    if (column === 'done' && target?.kind === 'issue' && target.doneCheck && !target.doneCheck.ready) {
      const go = await askConfirm({
        title: '아직 완료 조건이 다 채워지지 않았어요',
        message: '아래 ✗ 항목이 남아 있습니다. 그래도 완료로 옮기시겠어요?',
        items: target.doneCheck.checks,
        yes: '그래도 완료로 옮기기',
      });
      if (!go) return render(lastState);
    }
    try {
      await api('/api/move', { id, column });
      toast(`'${COLUMNS.find((entry) => entry[0] === column)[1]}' 칸으로 옮겼어요`);
      // 끝난 이슈의 워크트리 정리 — 미커밋 변경이 있으면 서버가 거부한다
      const card = (lastState?.cards || []).find((entry) => entry.id === id);
      if (column === 'done' && card?.kind === 'issue' && card.worktree?.exists) {
        const remove = await askConfirm({
          title: '이 이슈의 워크트리도 정리할까요?',
          message: `${card.worktree.rel} — 커밋하지 않은 변경이 있으면 지우지 않고 알려 드려요.`,
          yes: '워크트리 지우기',
        });
        if (remove) await api('/api/worktree-remove', { id, agent: card.agent }).then(() => toast('워크트리를 정리했어요')).catch((error) => toast(`워크트리를 지우지 못했어요: ${error.message}`));
      }
    } catch (error) {
      toast(`옮기지 못했어요: ${error.message}`);
    }
  };

  // 지시문 창
  let pending = null; // { mode: 'pane' | 'dispatch', agent }
  let currentJob = '';
  const ICON = { wait: '○', running: '⏳', done: '✓', skip: '–', warn: '!', error: '✗' };
  // 디스패치 단계 진행 — 팝업 안에 단계별로 그린다
  const renderJob = (job) => {
    if (job.id !== currentJob) return;
    const box = document.getElementById('ask-status');
    box.innerHTML = `<div class="steps">${job.steps.map((item) => `<span class="${item.state}">${ICON[item.state] || '·'} ${esc(item.label)}${item.detail ? ` — ${esc(item.detail)}` : ''}${item.sec != null && item.state !== 'wait' ? ` <span style="color:var(--muted)">(${item.sec}s)</span>` : ''}</span>`).join('')}</div>`;
    if (job.state === 'done') {
      currentJob = '';
      setTimeout(() => {
        document.getElementById('ask').close();
        toast(`${job.agent} 에게 맡겼어요 · ${(job.result?.pane || '').split(' ')[0]}`);
      }, 900);
    } else if (job.state === 'error') {
      currentJob = '';
      box.innerHTML += `<div style="color:var(--bad);margin-top:6px">맡기지 못했어요: ${esc(job.error)}</div>`;
      document.getElementById('ask-send').disabled = false;
    }
  };
  let pendingId = '';
  const ask = (title, text, mode = 'pane', agent = '', id = '') => {
    pendingId = id;
    const dialog = document.getElementById('ask');
    const to = document.getElementById('ask-to');
    if (mode === 'issue') {
      // 받는 곳을 고른다 — 헤르메스(처리) 또는 담당 에이전트로 바로(조사만). 고르면 지시문도 바뀐다
      const card = (lastState?.cards || []).find((entry) => entry.id === id);
      const route = (choice) => {
        if (choice === 'hermes') {
          // 떠 있는 헤르메스 대화에 섞지 않고 새 헤르메스 pane 을 열어 처리한다(/api/hermes-new)
          ask(title, text, 'hermes-new', agent, id);
          document.getElementById('ask-to').innerHTML = `→ 받는 곳 <b>새 헤르메스 pane</b> (🧭 헤르메스 · 이슈 제목) — 판단 → 계획서 → prBase 브랜치 → 담당 에이전트까지 이어서 처리해요. 지금 하던 헤르메스 대화에는 끼어들지 않아요 ${picker('hermes')}`;
        } else {
          ask(title, INVESTIGATE(card), 'dispatch', agent, id);
          document.getElementById('ask-to').innerHTML += ` ${picker('investigate')}`;
        }
        document.getElementById('ask-route').onchange = (event) => route(event.target.value);
        return true;
      };
      const picker = (current) => `<br>보내는 곳 바꾸기 <select id="ask-route"><option value="hermes" ${current === 'hermes' ? 'selected' : ''}>헤르메스로 (처리)</option><option value="investigate" ${current === 'investigate' ? 'selected' : ''}>담당 에이전트로 바로 (조사만 · 코드 수정 없음)</option></select>`;
      route('hermes');
      return;
    }
    if (mode === 'dispatch') {
      const names = lastState?.agents || [];
      to.innerHTML = `→ 담당 에이전트 <select id="ask-agent">${names.map((name) => `<option ${name === agent ? 'selected' : ''}>${esc(name)}</option>`).join('')}</select> 를 그 레포 workspace 에 새 pane 으로 띄워요`;
      if (!agent) to.innerHTML += ' — <b>이슈에 담당이 정해져 있지 않아요. 골라 주세요</b>';
      const card = (lastState?.cards || []).find((entry) => entry.id === id);
      if (card?.worktree) to.innerHTML += `<br>워크트리 <code>${esc(card.worktree.rel)}</code> ← ${esc(card.worktree.ref)} (detached${card.worktree.exists ? ', 이미 있어서 그대로 써요' : ', 새로 만들어요'}) · 담당을 바꾸면 그 에이전트의 레포에 만들어요`;
    } else if (mode === 'hermes-new') {
      // 받는 곳 안내는 이슈 팝업(route)이 채운다
    } else if (mode === 'review') {
      const card = (lastState?.cards || []).find((entry) => entry.id === id);
      to.innerHTML = `→ <b>reviewer</b> 를 계획서의 담당 레포 workspace 에 새 pane 으로 띄워요${card?.workRef ? `<br>대상 <code>${esc(card.workRef)}</code>` : ''} · 헤르메스는 거치지 않아요`;
    } else {
      // 받는 곳: 카드에 붙은 에이전트 pane → 없으면 헤르메스 pane. 팝업 안에서만 바꿀 수 있다
      const candidates = (lastState?.panes || []).filter((entry) => entry.role !== 'other');
      const card = (lastState?.cards || []).find((entry) => entry.id === id);
      const attached = [...(card?.agents || []), ...(card?.linkedPlan?.agents || [])];
      const preferred = candidates.find((entry) => attached.includes(entry.id)) || candidates.find((entry) => entry.role === 'hermes') || candidates[0];
      if (!preferred) return toast('지시를 받을 헤르메스·에이전트 pane 이 없어요');
      targetPane = preferred.id;
      to.innerHTML = `→ 받는 곳 <select id="ask-pane">${candidates.map((entry) => `<option value="${esc(entry.id)}" ${entry.id === targetPane ? 'selected' : ''}>${esc(entry.agent)} · ${esc(entry.id)}${entry.status === 'working' ? ' (작업 중)' : ''}</option>`).join('')}</select>`;
      document.getElementById('ask-pane').onchange = (event) => { targetPane = event.target.value; };
    }
    pending = { mode, id: pendingId };
    setStatus('', '');
    document.getElementById('ask-send').disabled = false;
    document.getElementById('ask-title').textContent = title;
    document.getElementById('ask-text').value = text;
    // 이슈 팝업에서 받는 곳을 바꾸면 열린 채로 다시 그린다
    if (!dialog.open) dialog.showModal();
  };
  document.getElementById('ask-cancel').onclick = () => document.getElementById('ask').close();
  // 팝업 안에 진행·오류를 보여 준다 — 알림(toast)은 모달 뒤에 가려 안 보인다
  const setStatus = (message, tone) => {
    const element = document.getElementById('ask-status');
    element.textContent = message;
    element.style.color = tone === 'error' ? 'var(--bad)' : tone === 'busy' ? 'var(--accent)' : 'var(--muted)';
  };
  document.getElementById('ask-send').onclick = async () => {
    const text = document.getElementById('ask-text').value;
    const sendButton = document.getElementById('ask-send');
    if (sendButton.disabled) return;
    sendButton.disabled = true;
    setStatus('보내는 중이에요…', 'busy');
    try {
      if (pending?.mode === 'dispatch') {
        const agent = document.getElementById('ask-agent').value;
        const result = await api('/api/dispatch', { id: pending.id, agent, text });
        // 202 — 진행은 SSE event: job 으로 온다 (renderJob)
        currentJob = result.job;
        setStatus('', '');
        return;
      }
      if (pending?.mode === 'hermes-new') {
        const result = await api('/api/hermes-new', { id: pending.id, text });
        document.getElementById('ask').close();
        toast(`새 헤르메스 pane 에서 시작했어요 · ${result.pane}`);
        return;
      }
      if (pending?.mode === 'review') {
        const result = await api('/api/review', { id: pending.id, text });
        document.getElementById('ask').close();
        toast(`reviewer 를 띄웠어요 · ${(result.pane || '').split(' ')[0]}`);
        return;
      }
      await api('/api/action', { pane: targetPane, text });
      document.getElementById('ask').close();
      toast('보냈어요');
    } catch (error) {
      setStatus(`보내지 못했어요: ${error.message}`, 'error');
      sendButton.disabled = false;
    }
  };

  const controls = (card) => {
    const actions = ((ACTIONS[card.kind] || {})[card.status] || [])
      .map(([label], index) => `<button class="btn" data-act="${index}" data-id="${esc(card.id)}">${label}</button>`)
      .join('');
    const movable = !card.archived;
    // 완료 칸은 현황판이 바로 처리하는 [아카이브] 하나만 — 끝난 일에 지시할 것은 없다
    if (card.column === 'done') return `<div class="actions"><button class="btn" data-archive="${esc(card.id)}" title="끝난 일을 보관하고 보드에서 치워요" style="margin-left:auto">아카이브</button></div>`;
    return `<div class="actions">${actions}<button class="btn" data-act="free" data-id="${esc(card.id)}">직접 지시</button>
      ${movable ? `<button class="btn danger" data-delete="${esc(card.id)}" title="휴지통으로 옮겨요">삭제</button>` : ''}</div>`;
  };

  const agentCard = (item) => {
    const status = item.status || 'unknown';
    const dotClass = status === 'working' ? 'dot on' : status === 'blocked' ? 'dot off' : 'dot';
    const where = item.kind === 'pane'
      ? `${esc(item.id)} · ${esc(item.cwd)}${item.branch ? ` · 🌿 ${esc(item.branch)}` : ''}`
      : `백그라운드 · ${ago(item.ageSec)}`;
    const detail = item.kind === 'pane' ? item.title : item.lastTool || item.title;
    return `<div class="agent">
      <div class="row"><span class="${dotClass}"></span><span class="name">${esc(item.agent)}</span>
        <span class="pill ${status === 'working' ? 'working' : status === 'blocked' ? 'blocked' : ''}">${STATUS_LABEL[status] || esc(status)}</span>
        ${item.tool ? `<span class="pill">${esc(item.tool)}</span>` : ''}</div>
      <div class="sub">${where}</div>
      ${detail ? `<div class="sub" title="${esc(detail)}">${esc(detail)}</div>` : ''}
      ${item.kind === 'subagent' && item.title && item.lastTool ? `<div class="sub">${esc(item.title)}</div>` : ''}
    </div>`;
  };

  // 정식 계획서만 제목 옆에 문서 아이콘 — 경량은 표시하지 않는다
  const formalMark = (plan) => plan?.grade === 'formal' ? '<span class="formal-mark" title="정식 계획서 — md + 결정 콘솔">📄</span>' : '';

  // 카드에는 브랜치만 — 워크트리 경로·pane 까지 든 Work ref 전체는 마우스를 올리면. 파일 경로는 카드 상세에 있다
  // hermes 자체 작업은 워크트리 없이 main 에서 한다 — 🌿 가 없어도 🏠 로 표시해 "아직 시작 안 한 일" 과 구분한다
  const branchLine = (workRef, id = '') => {
    const branch = (workRef || '').match(/🌿\s*([^\s·(]+)/)?.[1];
    if (branch) return `<div class="line" title="${esc(workRef)}">🌿 ${esc(branch)}</div>`;
    if (/^hermes\b/.test(workRef || '') || /\/\d{8}-hermes-/.test(id)) return `<div class="line" title="${esc(workRef || '')}">🏠 hermes · main</div>`;
    return '';
  };

  const planCard = (card, panes) => {
    const tags = [`<span class="pill">${esc(card.status)}</span>`];
    if (card.blocked) tags.push(`<span class="pill bad">막힘</span>`);
    if (card.working && card.status !== 'in_progress') tags.push('<span class="pill working">에이전트 작업 중</span>');
    const running = (card.agents || []).map((id) => panes.find((pane) => pane.id === id)).filter(Boolean);
    for (const pane of running) tags.push(`<span class="pill ${pane.status === 'working' ? 'working' : ''}">🤖 ${esc(pane.agent)}</span>`);
    const progress = card.progress ? `<div class="progress" title="${card.progress.checked}/${card.progress.total}"><i style="width:${Math.round((card.progress.checked / card.progress.total) * 100)}%"></i></div><div class="line">진행 ${card.progress.checked}/${card.progress.total}</div>` : '';
    return `<div class="card" data-key="${esc(card.id)}" draggable="${!card.archived}">
      <div class="title" title="${esc(card.id)}">${formalMark(card)}${esc(card.title)}</div>
      ${when(card)}
      <div class="tags">${tags.join('')}</div>
      ${card.statusNote ? `<div class="line">${esc(card.statusNote)}</div>` : ''}
      ${progress}
      ${card.blocked ? `<div class="line"><b>막힘</b> ${esc(card.blocked)}</div>` : ''}
      ${card.next && card.column !== 'done' ? `<div class="line"><b>다음</b> ${esc(card.next)}</div>` : ''}
      ${branchLine(card.workRef, card.id)}
      ${card.html ? `<a href="/${esc(card.html)}" target="_blank">결정 콘솔 열기 ↗</a>` : ''}
      ${controls(card)}
    </div>`;
  };

  // 이슈 카드 안에 합친 계획서 — 경로·진행·막힘·에이전트
  const linkedPlan = (card, panes) => {
    const plan = card.linkedPlan;
    if (!plan) return '';
    const running = (plan.agents || []).map((id) => panes.find((pane) => pane.id === id)).filter(Boolean);
    const bar = plan.progress ? `<div class="progress"><i style="width:${Math.round((plan.progress.checked / plan.progress.total) * 100)}%"></i></div>` : '';
    return `<div class="line">📋 <b>계획</b> ${esc(plan.status)}${plan.progress ? ` · 진행 ${plan.progress.checked}/${plan.progress.total}` : ''}${running.map((pane) => ` · <span class="pill ${pane.status === 'working' ? 'working' : ''}">🤖 ${esc(pane.agent)}</span>`).join('')}</div>
      ${bar}
      ${plan.blocked ? `<div class="line"><b>막힘</b> ${esc(plan.blocked)}</div>` : ''}`;
  };

  const issueCard = (card, panes = []) => {
    const tags = [];
    if (card.repo) tags.push(`<span class="pill">${esc(card.repo)}</span>`);
    tags.push(`<span class="pill">${card.agent ? `🤖 ${esc(card.agent)}` : '담당 미정'}</span>`);
    const check = card.doneCheck;
    if (check?.ready && card.column !== 'done') tags.push('<span class="pill ready">완료 가능</span>');
    if (card.type) tags.push(`<span class="pill">${esc(card.type)}</span>`);
    if (card.severity) tags.push(`<span class="pill ${card.severity === 'high' ? 'bad' : card.severity === 'medium' ? 'warn' : ''}">${esc(card.severity)}</span>`);
    return `<div class="card" data-key="${esc(card.id)}" draggable="true">
      <div class="title" title="${esc([card.summary, card.source && `출처 ${card.source}`, card.id, card.linkedPlan && `계획 ${card.linkedPlan.id}`].filter(Boolean).join('\n'))}">${formalMark(card.linkedPlan)}${esc(card.title)}</div>
      ${when(card)}
      <div class="tags">${tags.join('')}</div>
      ${card.linkedPlan ? branchLine(card.linkedPlan.workRef, card.linkedPlan.id) : ''}
      ${linkedPlan(card, panes)}
      ${check && card.column !== 'done' && card.column !== 'issue' ? `<div class="checks">${check.checks.map((item) => `<span class="${item.ok ? 'ok' : ''}">${item.ok ? '✓' : '·'} ${esc(item.label)}</span>`).join('')}</div>` : ''}
      ${controls(card)}
    </div>`;
  };

  const render = (state) => {
    lastState = state;
    const agents = [...(state.panes || []), ...(state.subagents || [])];
    // 가로 스크롤 위치는 다시 그려도 유지한다
    const agentsBox = document.getElementById('agents');
    const agentsScroll = agentsBox.scrollLeft;
    agentsBox.innerHTML = agents.length
      ? agents.map(agentCard).join('')
      : `<div class="empty">${state.herdr ? '지금 돌고 있는 에이전트가 없어요' : 'herdr 를 찾지 못했어요 — herdr 안에서 현황판을 띄우면 pane 이 보여요'}</div>`;
    agentsBox.scrollLeft = agentsScroll;

    const cards = state.cards || [];
    document.getElementById('board').innerHTML = COLUMNS.map(([key, label, color]) => {
      const inColumn = cards.filter((card) => card.column === key).sort((left, right) => right.mtime - left.mtime);
      const body = inColumn.map((card) => (card.kind === 'plan' ? planCard(card, state.panes || []) : issueCard(card, state.panes || []))).join('') || '<div class="empty">비어 있어요</div>';
      return `<div class="col" data-col="${key}"><div class="col-head"><span class="bar" style="background:${color}"></span>${label}<span class="count">${inColumn.length}</span></div>${body}</div>`;
    }).join('');

    const worktrees = state.worktrees || [];
    document.getElementById('worktrees').innerHTML = worktrees.length
      ? worktrees.map((wt) => `<div class="wt">📁 ${esc(wt.repo)} · 🌿 ${esc(wt.branch)}${wt.dirty ? ` · ✎${wt.dirty}` : ''}</div>`).join('')
      : '<div class="empty">비어 있어요</div>';

    // 바뀐 카드만 잠깐 반짝인다
    const next = new Map(cards.map((card) => [card.id, JSON.stringify(card)]));
    if (previous.size) {
      for (const [key, value] of next) {
        if (previous.get(key) !== value) document.querySelector(`[data-key="${CSS.escape(key)}"]`)?.classList.add('flash');
      }
    }
    previous = next;

    const findCard = (id) => (state.cards || []).find((card) => card.id === id);
    document.querySelectorAll('[data-act]').forEach((button) => {
      button.onclick = () => {
        const card = findCard(button.dataset.id);
        if (!card) return;
        if (button.dataset.act === 'free') return ask('직접 지시', `${card.id} `);
        const [label, build, mode] = ACTIONS[card.kind][card.status][Number(button.dataset.act)];
        ask(label, build(card), mode || 'pane', card.agent || '', card.id);
      };
    });
    document.querySelectorAll('.card .title').forEach((title) => {
      title.title = '누르면 요청·진행·결과를 볼 수 있어요';
      title.onclick = () => openDetail(title.closest('.card').dataset.key);
    });
    document.querySelectorAll('[data-delete]').forEach((button) => {
      button.onclick = async () => {
        const card = findCard(button.dataset.delete);
        if (!card) return;
        const items = [{ label: card.id, ok: false }];
        if (card.kind === 'issue' && card.linkedPlan?.id?.startsWith('plans/task/')) items.push({ label: `연결된 경량 계획서 ${card.linkedPlan.id}`, ok: false });
        if (card.kind === 'issue' && card.worktree?.exists) items.push({ label: `이슈 워크트리 ${card.worktree.rel} (커밋 안 된 변경이 있으면 남겨요)`, ok: false });
        if (card.kind === 'plan' && card.html) items.push({ label: `결정 콘솔 ${card.html}`, ok: false });
        const go = await askConfirm({
          title: `'${card.title}' 을(를) 삭제할까요?`,
          message: '아래 항목을 휴지통(.board-trash/날짜/)으로 옮겨요. 필요하면 거기서 되살릴 수 있어요. 떠 있는 에이전트 pane 은 닫지 않아요.',
          items,
          yes: '휴지통으로 옮기기',
        });
        if (!go) return;
        try {
          const result = await api('/api/delete', { id: card.id });
          toast(`휴지통으로 옮겼어요 (${result.moved.length}개)${result.notes?.length ? ` · ${result.notes.join(' · ')}` : ''}`);
        } catch (error) {
          toast(`삭제하지 못했어요: ${error.message}`);
        }
      };
    });
    document.querySelectorAll('[data-archive]').forEach((button) => {
      button.onclick = async () => {
        const card = findCard(button.dataset.archive);
        if (!card) return;
        const isIssue = card.kind === 'issue';
        const folder = `archive/${card.id.split('/').pop().replace(/\.md$/, '')}/`;
        const items = [{ label: `${card.id} → ${folder}${isIssue ? 'issue.md' : 'plan.md'}`, ok: true }];
        if (isIssue && card.linkedPlan?.id) items.push(card.linkedPlan.status === 'done'
          ? { label: `${card.linkedPlan.id} → ${folder}plan.md (같은 폴더로 묶어요)`, ok: true }
          : { label: `${card.linkedPlan.id} — 아직 끝나지 않아 두고 가요(Status ${card.linkedPlan.status})`, ok: false });
        if (isIssue && card.worktree?.exists) items.push({ label: `이슈 워크트리 ${card.worktree.rel} 정리 (커밋 안 된 변경이 있으면 남겨요)`, ok: true });
        if (!isIssue && card.html) items.push({ label: `결정 콘솔 ${card.html} → ${folder}plan.html`, ok: true });
        const go = await askConfirm({
          title: `'${card.title}' 을(를) 아카이브할까요?`,
          message: '끝난 일을 이슈·계획서 한 폴더(archive/)로 묶어 보관하고 보드에서 치워요. git 에 커밋돼 남고, 히스토리 탭에서 다시 볼 수 있어요.',
          items,
          yes: '아카이브',
        });
        if (!go) return;
        try {
          const result = await api('/api/archive', { id: card.id });
          toast(`아카이브했어요 (${result.moved.length}개)${result.notes?.length ? ` · ${result.notes.join(' · ')}` : ''}`);
        } catch (error) {
          toast(`아카이브하지 못했어요: ${error.message}`);
        }
      };
    });
    document.querySelectorAll('.card[draggable="true"]').forEach((element) => {
      element.ondragstart = (event) => { event.dataTransfer.setData('text/plain', element.dataset.key); element.classList.add('dragging'); };
      element.ondragend = () => element.classList.remove('dragging');
    });
    document.querySelectorAll('.col[data-col]').forEach((column) => {
      column.ondragover = (event) => { event.preventDefault(); column.classList.add('drop'); };
      column.ondragleave = () => column.classList.remove('drop');
      column.ondrop = (event) => {
        event.preventDefault();
        column.classList.remove('drop');
        const id = event.dataTransfer.getData('text/plain');
        const card = findCard(id);
        if (card && card.column !== column.dataset.col) moveTo(id, column.dataset.col);
      };
    });

    renderUsage();
    document.getElementById('updated').textContent = `마지막 변화 ${new Date(state.updatedAt).toLocaleTimeString('ko-KR')}`;
    document.getElementById('sync').textContent = state.header?.sync ? `마지막 sync ${new Date(state.header.sync).toLocaleString('ko-KR')}` : '';
  };

  // ── AI 사용량 게이지 — 설치된 CLI 마다 한 묶음 ──────────────────────
  // 값은 그 CLI 를 쓸 때만 갱신된다 — 10분 넘게 새 값이 없으면 흐리게 보여 준다
  // 로고 — simple-icons(CC0) 의 SVG path 를 그대로 넣었다. 서버가 오프라인이어도 보이게 외부에서 받지 않는다
  const LOGO_PATH = {
    claude: ['#d97757', 'm4.7144 15.9555 4.7174-2.6471.079-.2307-.079-.1275h-.2307l-.7893-.0486-2.6956-.0729-2.3375-.0971-2.2646-.1214-.5707-.1215-.5343-.7042.0546-.3522.4797-.3218.686.0608 1.5179.1032 2.2767.1578 1.6514.0972 2.4468.255h.3886l.0546-.1579-.1336-.0971-.1032-.0972L6.973 9.8356l-2.55-1.6879-1.3356-.9714-.7225-.4918-.3643-.4614-.1578-1.0078.6557-.7225.8803.0607.2246.0607.8925.686 1.9064 1.4754 2.4893 1.8336.3643.3035.1457-.1032.0182-.0728-.164-.2733-1.3539-2.4467-1.445-2.4893-.6435-1.032-.17-.6194c-.0607-.255-.1032-.4674-.1032-.7285L6.287.1335 6.6997 0l.9957.1336.419.3642.6192 1.4147 1.0018 2.2282 1.5543 3.0296.4553.8985.2429.8318.091.255h.1579v-.1457l.1275-1.706.2368-2.0947.2307-2.6957.0789-.7589.3764-.9107.7468-.4918.5828.2793.4797.686-.0668.4433-.2853 1.8517-.5586 2.9021-.3643 1.9429h.2125l.2429-.2429.9835-1.3053 1.6514-2.0643.7286-.8196.85-.9046.5464-.4311h1.0321l.759 1.1293-.34 1.1657-1.0625 1.3478-.8804 1.1414-1.2628 1.7-.7893 1.36.0729.1093.1882-.0183 2.8535-.607 1.5421-.2794 1.8396-.3157.8318.3886.091.3946-.3278.8075-1.967.4857-2.3072.4614-3.4364.8136-.0425.0304.0486.0607 1.5482.1457.6618.0364h1.621l3.0175.2247.7892.522.4736.6376-.079.4857-1.2142.6193-1.6393-.3886-3.825-.9107-1.3113-.3279h-.1822v.1093l1.0929 1.0686 2.0035 1.8092 2.5075 2.3314.1275.5768-.3218.4554-.34-.0486-2.2039-1.6575-.85-.7468-1.9246-1.621h-.1275v.17l.4432.6496 2.3436 3.5214.1214 1.0807-.17.3521-.6071.2125-.6679-.1214-1.3721-1.9246L14.38 17.959l-1.1414-1.9428-.1397.079-.674 7.2552-.3156.3703-.7286.2793-.6071-.4614-.3218-.7468.3218-1.4753.3886-1.9246.3157-1.53.2853-1.9004.17-.6314-.0121-.0425-.1397.0182-1.4328 1.9672-2.1796 2.9446-1.7243 1.8456-.4128.164-.7164-.3704.0667-.6618.4008-.5889 2.386-3.0357 1.4389-1.882.929-1.0868-.0062-.1579h-.0546l-6.3385 4.1164-1.1293.1457-.4857-.4554.0608-.7467.2307-.2429 1.9064-1.3114Z'],
    codex: ['currentColor', 'M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z'],
  };
  const cliLogo = (cli) => {
    const [fill, d] = LOGO_PATH[cli.id] || [];
    if (!d) return `<span class="logo letter">${esc(cli.label[0])}</span>`;
    return `<svg class="logo" viewBox="0 0 24 24" role="img" aria-label="${esc(cli.label)}"><path fill="${fill}" d="${d}"/></svg>`;
  };
  const untilReset = (resetsAt) => {
    if (!resetsAt) return '';
    const minutes = Math.max(0, Math.round((resetsAt - Date.now()) / 60_000));
    if (minutes < 60) return `↻ ${minutes}m`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `↻ ${hours}h ${minutes % 60}m`;
    return `↻ ${Math.floor(hours / 24)}d ${hours % 24}h`;
  };
  const gaugeLevel = (percent) => {
    if (percent >= 90) return 'bad';
    if (percent >= 70) return 'warn';
    return '';
  };
  const usageRows = (cli) => {
    if (!cli.windows.length) return `<span class="none">아직 사용 기록 없음</span>`;
    // 창 이름(5시간·주간)은 화면에서 빼고 마우스를 올리면 보이게
    return cli.windows.map((win) => `<div class="win" title="${esc(win.label)} 한도">
      <span class="gauge"><i class="${gaugeLevel(win.percent)}" style="width:${Math.min(100, win.percent)}%"></i></span>
      <span class="pct">${win.percent}%</span>
      <span class="reset">${untilReset(win.resetsAt)}</span></div>`).join('');
  };
  const usageTitle = (cli) => {
    if (!cli.at) return `${cli.label} — 사용하면 한도 사용량이 보여요`;
    return `${cli.label} 요금제 사용량 · ${ago(Math.max(0, Math.round((Date.now() - cli.at) / 1000)))} 기준 (그 CLI 를 쓸 때 갱신)`;
  };
  const renderUsage = () => {
    const box = document.getElementById('usage');
    const clis = lastState?.header?.usage ?? [];
    box.hidden = !clis.length;
    box.innerHTML = clis.map((cli) => `<div class="cli ${cli.at && Date.now() - cli.at > 600_000 ? 'stale' : ''} ${cli.windows.length ? '' : 'empty'}" title="${esc(usageTitle(cli))}">
      ${cliLogo(cli)}<div class="rows">${usageRows(cli)}</div></div>`).join('');
  };
  setInterval(renderUsage, 60_000);

  // 탭이 여러 개면 가장 최근에 앞으로 온 탭 하나만 실시간 연결을 쓴다 — 브라우저는 한 서버에 연결 6개까지라
  // 탭마다 SSE 를 잡으면 아카이브 같은 요청이 자리가 날 때까지 멈춘다
  let source = null;
  const tabId = Math.random().toString(36).slice(2);
  let channel = null;
  try { channel = new BroadcastChannel('hermes-board'); } catch { /* 지원 안 하면 탭마다 연결 */ }
  const pause = () => {
    if (source) { source.close(); source = null; }
    document.getElementById('live-dot').className = 'dot';
    document.getElementById('live-state').textContent = '';
    document.getElementById('live-text').innerHTML = '다른 탭에서 보고 있어요 · <a href="#" id="take-over">여기서 보기</a>';
    document.getElementById('take-over').onclick = (event) => { event.preventDefault(); claim(); };
  };
  const claim = () => {
    channel?.postMessage({ type: 'claim', tabId });
    if (!source) connect();
  };
  if (channel) channel.onmessage = (event) => { if (event.data?.type === 'claim' && event.data.tabId !== tabId) pause(); };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !source) claim(); });

  const connect = () => {
    source = new EventSource(`/events?boot=${BOOT}`);
    source.onopen = () => {
      document.getElementById('live-dot').className = 'dot on';
      document.getElementById('live-text').textContent = '';
      document.getElementById('live-state').textContent = '실시간 연결됨';
    };
    source.onmessage = (event) => {
      const state = JSON.parse(event.data);
      // 서버가 다시 떴다 — 이 페이지의 토큰은 더 이상 안 통하니 새로 불러온다
      if (state.boot && state.boot !== BOOT) return location.reload();
      render(state);
    };
    source.addEventListener('job', (event) => renderJob(JSON.parse(event.data)));
    source.onerror = () => {
      document.getElementById('live-dot').className = 'dot off';
      document.getElementById('live-text').textContent = '서버 끊김 — 다시 연결 중';
      document.getElementById('live-state').textContent = '';
    };
  };
  // ?once — SSE 없이 한 번만 그린다 (캡처·확인용)
  if (new URLSearchParams(location.search).has('once')) {
    fetch('/api/state').then((response) => response.json()).then(render);
  } else {
    claim();
  }
</script>
